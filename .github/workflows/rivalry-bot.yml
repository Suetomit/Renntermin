# Gehört nach .github/workflows/rivalry-bot.yml im Repo.
name: Rivalry Bot
on:
  schedule:
    - cron: '*/30 * * * *'   # alle 30 Minuten
  workflow_dispatch:          # zusätzlich per Knopf im Reiter "Actions" startbar
concurrency:
  group: rivalry-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: cp rivalry.js rivalry.mjs
      - run: node rivalry-bot.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
