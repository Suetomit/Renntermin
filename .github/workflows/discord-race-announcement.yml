name: Discord Eintrage-Erinnerung

on:
  schedule:
    # Täglich um 18:00 UTC (~19-20 Uhr deutsche Zeit, je nach Sommer-/Winterzeit).
    # Läuft nur, solange noch kein Renntermin bestätigt ist (siehe Skript-Logik) -
    # danach passiert von selbst nichts mehr, kein Spam.
    - cron: '0 18 * * *'
  workflow_dispatch: {} # erlaubt manuelles Auslösen über den "Run workflow"-Button zum Testen

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reminder-Skript ausführen
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ANNOUNCE_CHANNEL_ID: ${{ secrets.DISCORD_ANNOUNCE_CHANNEL_ID }}
          # Optional: WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
        run: node discord-reminder-bot.js
