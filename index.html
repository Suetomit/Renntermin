<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurkensöhne Cup 2026</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151922;
      --s3: #1f2430;
      --border: #2a3142;
      --text: #f0f4fc;
      --m: #8a99ad;
      --m2: #5c6878;
      --m3: #3b4453;
      --y: #ffd700;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; font-size: 14px; }
    
    .app-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    /* Top Status Bar */
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--m); }
    .dot { width: 10px; height: 10px; background: #ff9100; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot.live { background: #27f4d2; box-shadow: 0 0 8px #27f4d2; }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, #1e2430 0%, #0e121a 100%);
      border: 1px solid var(--border);
      border-left: 4px solid var(--y);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .hero-title { font-size: 0.75rem; color: var(--m); text-transform: uppercase; letter-spacing: 1px; }
    .hero-race-name { font-size: 1.3rem; font-weight: 800; color: #fff; }
    .hero-countdown { font-size: 1.1rem; font-weight: 700; color: var(--y); font-family: monospace; }

    /* Layout Grids */
    .grid-2col { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 992px) {
      .grid-2col { grid-template-columns: 360px 1fr; }
    }

    .grid-3col { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 1100px) {
      .grid-3col { grid-template-columns: 320px 1fr 340px; }
    }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    /* Name Selection & Form */
    .name-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 15px; }
    .name-btn { background: var(--s3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    .name-btn.selected { border-color: var(--y); background: rgba(255, 215, 0, 0.1); }
    .nb-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Calendar & Slots */
    .cal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-header { font-size: 0.75rem; color: var(--m); padding: 4px; }
    .cal-day { background: var(--s3); padding: 10px 4px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; border: 1px solid transparent; }
    .cal-day:hover { border-color: var(--y); }
    .cal-day.cal-selected { background: var(--y); color: #000; font-weight: 700; }
    .cal-day.cal-today { border-color: #27f4d2; }
    .cal-day.cal-past { opacity: 0.3; cursor: not-allowed; }
    .cal-empty { background: transparent; }

    .slot-card { background: var(--s3); border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 0.85rem; }
    .slot-date-label { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 8px; }
    .time-row { display: flex; align-items: center; gap: 8px; }
    .time-row input { background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 4px 8px; border-radius: 4px; }

    /* Standings Table & Search */
    .search-bar { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; margin-bottom: 12px; }
    .tabs { display: flex; gap: 8px; }
    .tab-btn { padding: 6px 12px; background: var(--s3); border: none; border-radius: 6px; color: var(--m); cursor: pointer; font-weight: 600; font-size: 0.8rem; }
    .tab-btn.active { background: var(--y); color: #000; }

    .standings-row { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); gap: 12px; border-radius: 8px; margin-bottom: 4px; }
    .st-pos { font-weight: 800; width: 28px; text-align: center; font-size: 0.9rem; }
    
    .standings-row.p1 { border: 1px solid var(--gold); background: rgba(255, 215, 0, 0.08); }
    .standings-row.p1 .st-pos { color: var(--gold); }
    .standings-row.p2 { border: 1px solid var(--silver); background: rgba(192, 192, 192, 0.08); }
    .standings-row.p2 .st-pos { color: var(--silver); }
    .standings-row.p3 { border: 1px solid var(--bronze); background: rgba(205, 127, 50, 0.08); }
    .standings-row.p3 .st-pos { color: var(--bronze); }

    .st-driver { flex: 1; display: flex; align-items: center; }
    .st-pts-wrap { text-align: right; }
    .st-pts { font-weight: 700; font-size: 1.1rem; }
    .st-pts-lbl { font-size: 0.65rem; color: var(--m2); }
    .st-bar-wrap { width: 60px; height: 6px; background: var(--s3); border-radius: 3px; overflow: hidden; margin-left: 10px; }
    .st-bar-fill { height: 100%; border-radius: 3px; }

    /* Race Calendar List */
    .race-list { display: flex; flex-direction: column; gap: 4px; max-height: 480px; overflow-y: auto; }
    .race-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; background: var(--s3); }
    .race-row.done { opacity: 0.6; }
    .race-row.next { border: 1px solid var(--y); background: rgba(255, 215, 0, 0.05); }
    .race-num { font-weight: 700; width: 20px; font-size: 0.8rem; color: var(--m); }
    .race-info { flex: 1; }
    .race-country { font-weight: 700; font-size: 0.85rem; }
    .race-city { font-size: 0.7rem; color: var(--m2); }

    /* Drivers Grid Cards */
    .driver-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .driver-tile { background: var(--s3); border-radius: 8px; padding: 12px; border-left: 4px solid var(--dc, var(--border)); }
    .dt-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .dt-name { font-weight: 700; }
    .dt-slot { background: var(--bg); padding: 6px 8px; border-radius: 4px; margin-top: 6px; font-size: 0.75rem; }

    /* Overview Cards */
    .date-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .dcard { background: var(--s3); border-radius: 8px; padding: 12px; border: 1px solid var(--border); position: relative; }
    .dcard.best { border-color: var(--y); }
    .dc-wd { font-size: 0.75rem; color: var(--m); }
    .dc-d { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; }
    .dc-cnt { font-size: 0.85rem; font-weight: 700; color: var(--y); }
    .dc-chip { display: inline-block; background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; margin: 2px; }

    /* Buttons & Controls */
    .btn { background: var(--y); color: #000; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-rm { background: none; border: none; color: #ff5555; cursor: pointer; font-size: 0.75rem; }
    .btn-copy { background: var(--s3); border: 1px solid var(--border); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; width: 100%; }
    .btn-copy.green { border-color: #52e252; color: #52e252; }

    /* Admin Section */
    .admin-sec { display: none; margin-top: 20px; }
    .admin-sec.on { display: block; }
    .pin-input { width: 100%; padding: 8px; background: var(--bg); border: 1px solid var(--border); color: #fff; border-radius: 6px; margin-bottom: 8px; }

    #loadingOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); display:flex; justify-content:center; align-items:center; z-index:999; }
  </style>
</head>

<div id="loadingOverlay">Lade Gurkensöhne-Daten...</div>

<div class="app-container">

    <div class="card">

  </div>

  <div class="grid-2col">
    <div class="card">
      <div class="card-title">
        <span>🏎️ Eingetragene Fahrer</span>
        <span id="pcountPill" style="font-size:0.8rem; color:var(--m);"></span>
      </div>
      <div id="personList"></div>
    </div>

    <div class="card">
      <div class="card-title">📊 Termin-Auswertung</div>
      <div id="overview"></div>
    </div>
  </div>

  <!-- Festgelegter Termin Banner -->
  <div id="confirmedArea"></div>

  <!-- Admin Controls Toggle -->
  <div style="text-align:center; margin-top:20px;">
    <button class="btn-copy" id="adminBtn" style="width:auto; padding:6px 16px;" onclick="toggleAdmin()">⚙️ Admin-Bereich</button>
  </div>

  <div class="card admin-sec" id="adminSec">
    <div class="card-title">🔑 Admin-Einstellungen</div>
    <div id="pinArea">
      <input type="password" id="pinIn" class="pin-input" placeholder="Admin PIN eingeben">
      <button class="btn" onclick="checkPin()">Freischalten</button>
      <div id="pinErr" style="color:#ff5555; font-size:0.8rem; margin-top:4px;"></div>
    </div>

    <div id="adminCtrl" style="display:none;">
      <p style="margin-bottom:10px;">Renntermin festlegen:</p>
      <div id="pickGrid" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;"></div>
      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input type="time" id="raceStart" value="14:00" class="pin-input" style="width:auto;">
        <input type="time" id="raceEnd" value="18:00" class="pin-input" style="width:auto;">
        <button class="btn" id="confBtn" style="margin-top:0;" onclick="confirmRace()">Bestätigen</button>
      </div>
      <hr style="border-color:var(--border); margin:15px 0;">
      <button class="btn-rm" onclick="resetAll()">⚠️ Alle Termin-Einträge zurücksetzen</button>
    </div>

    <div id="standingsAdminArea" style="display:none; margin-top:20px;">
      <p style="margin-bottom:10px;">WM-Punkte bearbeiten:</p>
      <div style="margin-bottom:10px;">Rennen absolviert: <input type="number" id="racesCompleted" style="width:60px;" class="pin-input"></div>

      <button class="btn" onclick="saveStandings()">Punkte Speichern</button>
    </div>
  </div>

</div>

function fallbackToLocal(){
  document.getElementById('loadingOverlay').style.display='none';
  document.getElementById('statusText').textContent='Nur lokal';
  try{const r=localStorage.getItem('rennplaner_local');if(r)S=JSON.parse(r);}catch(e){}
  cleanupPastDates();render();renderNameButtons();
}

async function saveState(){

function renderRaceCalendar(){

async function cleanupPastDates(){
  const today=new Date();today.setHours(0,0,0,0);let changed=false;
  S.persons=S.persons.map(p=>{
    const f=p.slots.filter(s=>new Date(s.date+'T00:00:00')>=today);
    if(f.length!==p.slots.length)changed=true;
    return{...p,slots:f};
  }).filter(p=>p.slots.length>0);
  if(S.confirmedDate){const cd=new Date(S.confirmedDate+'T00:00:00');if(cd<today){S.confirmedDate=null;S.confirmedStart=null;S.confirmedEnd=null;changed=true;}}
  if(changed)await saveState();
}

let standingsTab = 'fahrer'; 

window.switchTab = function(tab) {
  standingsTab = tab;
  document.getElementById('tabFahrer').classList.toggle('active', tab==='fahrer');
  document.getElementById('tabKonstrukteur').classList.toggle('active', tab==='konstrukteur');

function initStandings(database){
  standingsRef=ref(database,'standings');
  onValue(standingsRef,snap=>{
    const data=snap.val();
    if(data&&data.drivers&&data.drivers.length>0)standings=data;
    else{standings={drivers:INITIAL_STANDINGS,racesCompleted:3};set(standingsRef,standings);}
    render();
    if(adminUnlocked)renderStandingsInputs();
  });
}

function getDriverInfo(name){return ALL_DRIVERS.find(d=>d.name===name)||{name,team:'',human:null};}

function renderStandings(){
  const el=document.getElementById('standingsContent');
  if(!el) return;
  const query = document.getElementById('driverSearch')?.value.toLowerCase() || '';

  let sorted=[...standings.drivers].sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name));
  
  if(query) {
    sorted = sorted.filter(d => d.name.toLowerCase().includes(query) || getDriverInfo(d.name).team.toLowerCase().includes(query));
  }

  const maxPts=Math.max(sorted[0]?.points||1,1);
  el.innerHTML=sorted.map((d,i)=>{
    const info=getDriverInfo(d.name);
    const isHuman=!!info.human;
    const posClass=i===0?'p1':i===1?'p2':i===2?'p3':'';
    const badge=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
    const pct=Math.round(d.points/maxPts*100);

    return`<div class="standings-row ${posClass}">
      <div class="st-pos">${badge}</div>
      <div class="st-driver">
        <div>
          <div style="font-weight:700;font-size:0.85rem;">${d.name}</div>
          <div style="font-size:0.68rem;color:${TEAM_COLORS[info.team]||'#888'};">${info.team}</div>
        </div>
      </div>
      <div class="st-pts-wrap">
        <div class="st-pts">${d.points}</div>
        <div class="st-pts-lbl">Pts</div>
      </div>
      <div class="st-bar-wrap"><div class="st-bar-fill" style="width:${pct}%;background:${TEAM_COLORS[info.team]||'var(--y)'}"></div></div>
    </div>`;
  }).join('');
}

function renderConstructorStandings(){
  const el=document.getElementById('standingsContent');
  if(!el) return;
  const teamPts={};
  standings.drivers.forEach(d=>{
    const info=getDriverInfo(d.name);
    if(!info.team)return;
    teamPts[info.team]=(teamPts[info.team]||0)+d.points;
  });
  const sorted=Object.entries(teamPts).sort((a,b)=>b[1]-a[1]);
  const maxPts=Math.max(sorted[0]?.[1]||1,1);
  el.innerHTML=sorted.map(([team,pts],i)=>{
    const color=TEAM_COLORS[team]||'#555';
    const posClass=i===0?'p1':i===1?'p2':i===2?'p3':'';
    const badge=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
    const pct=Math.round(pts/maxPts*100);
    return`<div class="standings-row ${posClass}">
      <div class="st-pos">${badge}</div>
      <div class="st-driver">
        <div style="display:flex; align-items:center; gap:8px;">
          ${helmetImgByTeam(team)}
          <span style="font-weight:700; color:${color}">${team}</span>
        </div>
      </div>
      <div class="st-pts-wrap">
        <div class="st-pts" style="color:${color}">${pts}</div>
        <div class="st-pts-lbl">Pts</div>
      </div>
      <div class="st-bar-wrap"><div class="st-bar-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
  }).join('');
}

  const el=document.getElementById('standingsInputs');
  if(!el) return;
  document.getElementById('racesCompleted').value=standings.racesCompleted||0;

window.saveStandings=async function(){
  const drivers=ALL_DRIVERS.map((info,i)=>({name:info.name,points:parseInt(document.getElementById('pts_'+i)?.value)||0}));
  const racesCompleted=parseInt(document.getElementById('racesCompleted')?.value)||0;
  standings={drivers,racesCompleted};
  if(standingsRef){try{await set(standingsRef,standings);}catch(e){console.error(e);}}
  render();
};

function fmtDate(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});}
function fmtDateShort(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function fmtDateLong(iso){if(!iso)return'';return new Date(iso+'T00:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function fmtWD(iso){return new Date(iso+'T00:00:00').toLocaleDateString('de-DE',{weekday:'long'});}
function toISO(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function duration(f,t){if(!f||!t)return'';const[fh,fm]=f.split(':').map(Number),[th,tm]=t.split(':').map(Number),m=(th*60+tm)-(fh*60+fm);if(m<=0)return'';const h=Math.floor(m/60),r=m%60;return h>0?(r>0?`${h}h ${r}min`:`${h}h`):`${r}min`;}

const WEEKDAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function initCal(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth();renderCal();}
window.prevMonth=function(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCal();};
window.nextMonth=function(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCal();};

function renderCal(){
  const titleEl = document.getElementById('calTitle');
  if(!titleEl) return;
  titleEl.textContent=MONTHS[calMonth]+' '+calYear;
  const grid=document.getElementById('calGrid');
  const today=new Date();today.setHours(0,0,0,0);
  let html=WEEKDAYS.map(d=>`<div class="cal-header">${d}</div>`).join('');
  const firstDay=new Date(calYear,calMonth,1);
  let startDow=firstDay.getDay();startDow=startDow===0?6:startDow-1;
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  for(let i=0;i<startDow;i++)html+=`<div class="cal-day cal-empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const iso=toISO(calYear,calMonth,d);
    const date=new Date(iso+'T00:00:00');
    const isPast=date<today,isToday=date.getTime()===today.getTime();
    const isSel=selectedDates.find(x=>x.date===iso);
    const cls=['cal-day',isPast?'cal-past':'',isToday?'cal-today':'',isSel?'cal-selected':''].filter(Boolean).join(' ');
    html+=`<div class="${cls}" onclick="toggleDate('${iso}')">${d}</div>`;
  }
  grid.innerHTML=html;
  renderSelDates();
}

window.toggleDate=function(iso){
  const idx=selectedDates.findIndex(d=>d.date===iso);
  if(idx>=0)selectedDates.splice(idx,1);
  else{selectedDates.push({date:iso,from:'14:00',to:'18:00'});selectedDates.sort((a,b)=>a.date.localeCompare(b.date));}
  renderCal();renderSelDates();
};

function renderSelDates(){
  const el=document.getElementById('selDates');
  if(!el) return;
  if(!selectedDates.length){el.innerHTML='<div style="font-size:0.75rem;color:var(--m);font-style:italic;margin-top:8px;">Keine Tage ausgewählt</div>';return;}
  el.innerHTML=selectedDates.map((entry,i)=>`
    <div class="slot-card">
      <div class="slot-date-label">
        <span>${fmtDate(entry.date)}</span>
        <button class="btn-rm" onclick="toggleDate('${entry.date}')">✕</button>
      </div>
      <div class="time-row">
        <input type="time" value="${entry.from}" onchange="updateSlotTime(${i},'from',this.value)"/>
        <span>→</span>
        <input type="time" value="${entry.to}" onchange="updateSlotTime(${i},'to',this.value)"/>
      </div>
    </div>`).join('');
}

window.updateSlotTime=function(i,field,value){if(selectedDates[i])selectedDates[i][field]=value;};

function renderNameButtons(){
  const wrap=document.getElementById('nameButtons');if(!wrap)return;
  const taken=S.persons.map(p=>p.name);
  wrap.innerHTML=DRIVERS.map((name,i)=>{
    const hasEntry=taken.includes(name),isSel=currentUser===name;
    return`<button type="button" class="name-btn ${isSel?'selected':''}" onclick="selectName('${name}')">
      <span class="nb-dot" style="background:${ac(i)}"></span>
      <span>${name}${hasEntry&&!isSel?' ✏️':''}</span>
    </button>`;
  }).join('');
}

window.selectName=function(name){
  currentUser=name;document.getElementById('nameInput').value=name;
  const existing=S.persons.find(p=>p.name===name);
  if(existing&&existing.slots.length>0){selectedDates=existing.slots.map(s=>({date:s.date,from:s.from,to:s.to}));showMsg('Eintrag geladen.');}
  else{selectedDates=[];showMsg('');}
  renderCal();renderSelDates();renderNameButtons();renderPersons();
};

window.submitPerson=async function(){
  const name=currentUser;
  if(!name){showMsg('Bitte Namen auswählen.');return;}
  if(!selectedDates.length){showMsg('Bitte min. einen Tag wählen.');return;}
  S.persons=S.persons.filter(p=>p.name!==name);
  S.persons.push({name,slots:selectedDates.map(e=>({date:e.date,from:e.from,to:e.to}))});
  await saveState();showMsg('');currentUser='';document.getElementById('nameInput').value='';
  selectedDates=[];renderCal();renderSelDates();renderNameButtons();
};

function showMsg(m){const el=document.getElementById('fmsg');if(el)el.textContent=m;}

window.deleteSlot=async function(personName,slotIdx){
  const p=S.persons.find(px=>px.name===personName);if(!p)return;
  p.slots.splice(slotIdx,1);
  if(p.slots.length===0)S.persons=S.persons.filter(px=>px.name!==personName);
  await saveState();renderNameButtons();
};

window.copySlot=async function(date,from,to,myName){
  if(!myName){showMsg('Name auswählen.');return;}
  let person=S.persons.find(p=>p.name===myName);
  if(!person){person={name:myName,slots:[]};S.persons.push(person);}
  const existingIdx=person.slots.findIndex(s=>s.date===date);
  if(existingIdx>=0)person.slots[existingIdx]={date,from,to};
  else person.slots.push({date,from,to});
  await saveState();renderNameButtons();
};

window.toggleAdmin=function(){
  document.getElementById('adminSec').classList.toggle('on');
};

window.checkPin=function(){
  if(document.getElementById('pinIn').value===PIN){
    adminUnlocked=true;
    document.getElementById('pinArea').style.display='none';
    document.getElementById('adminCtrl').style.display='block';
    document.getElementById('standingsAdminArea').style.display='block';
    renderStandingsInputs();renderOverview();
  }else{document.getElementById('pinErr').textContent='Falscher PIN!';}
};

window.confirmRace=async function(){
  const selBtn=document.querySelector('.pbtn.sel');
  if(!selBtn)return;
  S.confirmedDate=selBtn.dataset.date;
  S.confirmedStart=document.getElementById('raceStart').value;
  S.confirmedEnd=document.getElementById('raceEnd').value;
  await saveState();
};

window.resetAll=async function(){
  if(!confirm('ALLES ZURÜCKSETZEN?'))return;
  S={persons:[],confirmedDate:null,confirmedStart:null,confirmedEnd:null};
  await saveState();renderNameButtons();
};

function renderPersons(){
  const el=document.getElementById('personList');
  const pill=document.getElementById('pcountPill');
  if(pill) pill.textContent=`${S.persons.length} / ${DRIVERS.length}`;
  
  if(!S.persons.length){el.innerHTML='<div style="color:var(--m); font-size:0.85rem;">Noch keine Einträge.</div>';return;}
  el.innerHTML=`<div class="driver-grid">${
    DRIVERS.map((name,i)=>{
      const p=S.persons.find(px=>px.name===name);
      const isMe=currentUser===name;
      const color=ac(i);
      if(!p||!p.slots.length){
        return`<div class="driver-tile" style="--dc:${color};opacity:0.5;">
          <div class="dt-head">${helmetImg(name)}<div class="dt-name">${name}</div></div>
          <div style="font-size:0.75rem; color:var(--m);">Keine Termine</div>
        </div>`;
      }
      return`<div class="driver-tile" style="--dc:${color}">
        <div class="dt-head">${helmetImg(name)}<div class="dt-name">${name}</div></div>
        ${p.slots.map((s,sidx)=>`
          <div class="dt-slot">
            <div style="font-weight:700;">${fmtDateShort(s.date)} (${fmtWD(s.date)})</div>
            <div>${s.from} - ${s.to} Uhr (${duration(s.from,s.to)})</div>
            ${isMe||adminUnlocked?`<button class="btn-rm" onclick="deleteSlot('${name}',${sidx})">Löschen</button>`:''}
          </div>
        `).join('')}
      </div>`;
    }).join('')
  }</div>`;
}

function renderOverview(){
  const el=document.getElementById('overview');
  if(!el) return;
  const datesMap={};
  S.persons.forEach(p=>{
    p.slots.forEach(s=>{
      if(!datesMap[s.date])datesMap[s.date]=[];
      datesMap[s.date].push({name:p.name,from:s.from,to:s.to});
    });
  });
  const dateKeys=Object.keys(datesMap).sort();
  if(!dateKeys.length){el.innerHTML='<div style="color:var(--m); font-size:0.85rem;">Keine Auswertung verfügbar.</div>';return;}
  
  let html=`<div class="date-grid">`;
  let bestCount=0;
  dateKeys.forEach(d=>{ if(datesMap[d].length>bestCount)bestCount=datesMap[d].length; });

  dateKeys.forEach(d=>{
    const list=datesMap[d];
    const isBest=list.length===bestCount&&bestCount>1;
    const isChosen=S.confirmedDate===d;
    
    html+=`<div class="dcard ${isBest?'best':''}">
      ${isChosen?'<span style="color:#52e252; font-weight:700; font-size:0.7rem;">BESTÄTIGT</span>':''}
      <div class="dc-wd">${fmtWD(d)}</div>
      <div class="dc-d">${fmtDateShort(d)}</div>
      <div class="dc-cnt">${list.length} / ${DRIVERS.length} Fahrer</div>
      <div style="margin-top:6px;">
        ${list.map(l=>`<span class="dc-chip">${l.name} (${l.from}-${l.to})</span>`).join('')}
      </div>
      ${currentUser&&!list.map(l=>l.name).includes(currentUser)?`
        <button class="btn-copy green" style="margin-top:8px;" onclick="copySlot('${d}','14:00','18:00','${currentUser}')">+ Auch eintragen</button>`:''}
    </div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;

  const pgrid=document.getElementById('pickGrid');
  if(pgrid&&adminUnlocked){
    pgrid.innerHTML=dateKeys.map(d=>`
      <button type="button" class="btn-copy pbtn ${S.confirmedDate===d?'sel':''}" data-date="${d}" onclick="selectAdminDate(this,'${d}')">
        ${fmtDateShort(d)} (${datesMap[d].length})
      </button>
    `).join('');
  }
}

window.selectAdminDate=function(btn,date){
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
};

function renderConfirmedArea(){
  const el=document.getElementById('confirmedArea');
  if(!el) return;
  if(!S.confirmedDate){el.innerHTML='';return;}
  el.innerHTML=`
    <div class="card" style="border-color:#27f4d2; background:rgba(39,244,210,0.05); text-align:center;">
      <div style="color:#27f4d2; font-weight:800; letter-spacing:1px; font-size:0.8rem;">🏁 RENNTERMIN FESTGELEGT</div>
      <div style="font-size:1.4rem; font-weight:800; margin:4px 0;">${fmtDateLong(S.confirmedDate)}</div>
      <div style="color:var(--m);">Uhrzeit: ${S.confirmedStart||'14:00'} - ${S.confirmedEnd||'18:00'} Uhr</div>
    </div>
  `;
}

function render(){
  renderRaceCalendar();
  renderPersons();
  renderOverview();
  renderConfirmedArea();
  if(standingsTab==='fahrer') renderStandings();
  else renderConstructorStandings();
}

initCal();
