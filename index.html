<style>

nav button.on{color:var(--gold);background:rgba(255,210,63,.1)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

const app = initializeApp({

  appId: "1:395947948221:web:8b201ab21470678caa9fd4"
});
const db = getDatabase(app);

const TC = {'Ferrari':'#e8002d','McLaren':'#ff8000','Red Bull':'#3671c6','Mercedes-AMG Petronas':'#27f4d2','Aston Martin':'#358c75','Alpine':'#ff87bc','Williams':'#64c4ff','Visa Cash App RB':'#6692ff','Kick Sauber':'#52e252','Haas':'#b6babd'};
const F1 = {1:25,2:18,3:15,4:12,5:10,6:8,7:6,8:4,9:2,10:1};

const MASTER = ('AUS|au|Australien|Melbourne|Australia.avif;CHN|cn|China|Shanghai|China.avif;JPN|jp|Japan|Suzuka|Japan.avif;BHR|bh|Bahrain|Sachir|Bahrain.avif;SAU|sa|Saudi-Arabien|Dschidda|Saudi_Arabia.avif;MIA|us|USA|Miami|Miami.avif;IMO|it|Emilia-Romagna|Imola|Emilia Romagna.avif;MCO|mc|Monaco|Monte Carlo|Monaco.avif;ESP|es|Spanien|Barcelona|Spain.avif;CAN|ca|Kanada|Montreal|Canada.avif;AUT|at|Österreich|Spielberg|Austria.avif;GBR|gb|Großbritannien|Silverstone|Great Britain.avif;BEL|be|Belgien|Spa-Francorchamps|Belgium.avif;HUN|hu|Ungarn|Hungaroring|Hungary.avif;NLD|nl|Niederlande|Zandvoort|Netherlands.avif;ITA|it|Italien|Monza|Italy.avif;AZE|az|Aserbaidschan|Baku|Azerbaijan.avif;SGP|sg|Singapur|Singapur|Singapore.avif;USA|us|USA|Austin|USA.avif;MEX|mx|Mexiko|Mexiko-Stadt|Mexico.avif;BRA|br|Brasilien|São Paulo|Brazil.avif;VGS|us|USA|Las Vegas|Las Vegas.avif;QAT|qa|Katar|Lusail|Qatar.avif;UAE|ae|Ver. Arab. Emirate|Abu Dhabi|Abu Dhabi.avif')
  .split(';').map(s => { const [code, cc, country, city, hero] = s.split('|'); return { code, cc, country, city, hero }; });

const TRK = 'australia-gp,chinese-gp,japanese-gp,bahrain-gp,saudi-arabian-gp,miami-gp,emilia-romagna-gp,monaco-gp,spanish-gp,canadian-gp,austrian-gp,british-gp,belgian-gp,hungarian-gp,dutch-gp,italian-gp,azerbaijan-gp,singapore-gp,united-states-gp,mexican-gp,sao-paulo-gp,las-vegas-gp,qatar-gp,yas-marina-circuit-abu-dhabi-2'.split(',');
MASTER.forEach((m, i) => m.trk = TRK[i] + '.png');
const HELM = { 'McLaren': 'mclaren', 'Mercedes-AMG Petronas': 'mercedes', 'Ferrari': 'ferrari', 'Red Bull': 'redbull', 'Aston Martin': 'astonmartin', 'Williams': 'williams', 'Alpine': 'alpine', 'Haas': 'haas', 'Visa Cash App RB': 'racingbulls', 'Kick Sauber': 'kicksauber' };
const DEF = ('Timotheus Müller|Visa Cash App RB|Timo;Pascale Braasch|Visa Cash App RB|Pascale;Niklas Schweisfurth|Aston Martin|Niklas;Tim Löffler|Kick Sauber|Tim;Marcel Walle|Red Bull|Marcel;Yannis Herling|Alpine|Yannis;Eric Walter|Ferrari|Eric;Philipp Juny|McLaren|Philipp;Charles Leclerc|Ferrari|;Lando Norris|McLaren|;Andrea Kimi Antonelli|Mercedes-AMG Petronas|;Max Verstappen|Red Bull|;George Russell|Mercedes-AMG Petronas|;Alex Albon|Williams|;Carlos Sainz|Williams|;Pierre Gasly|Alpine|;Oliver Bearman|Haas|;Nico Hulkenberg|Kick Sauber|;Esteban Ocon|Haas|;Lance Stroll|Aston Martin|')
  .split(';').map(s => { const [name, team, human] = s.split('|'); return { name, team, human: human || null }; });

let S = { persons: [], date: null, start: null, end: null };
let RR = {}, RS = {}, TR = {}, roster = DEF, cal = null, TA = {}, openRace = null, rdFlag = false, DS = {}, DC = {}, RV = {}, RN = {};
let view = 'home', me = '', sel = [], tm = {}, wt = 'd', sv = 'elo', msg = '', SA = {}, LT = null, rvA = '', rvB = '';

const toArr = v => v ? (Array.isArray(v) ? v : Object.values(v)) : [];
const nm = d => d.human || d.name;
const av = d => d.photo ? `<img class="av" src="${d.photo}" alt="" onerror="this.remove()">` : '';
const humans = () => roster.filter(d => d.human);
const races = () => {
  const codes = cal && cal.length ? cal : MASTER.map(r => r.code);
  return codes.map((c, i) => ({ ...MASTER.find(r => r.code === c), num: i + 1 })).filter(r => r.code);
};
const isDone = r => !!RS[r.num];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtLong = s => new Date(s + 'T00:00:00').toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => new Date(s + 'T00:00:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
const flag = cc => `<img class="flag" src="https://flagcdn.com/w40/${cc}.png" alt="">`;

function standings() {
  const m = {};
  roster.forEach(d => m[d.name] = 0);
  Object.values(RR).forEach(r => Object.entries(r || {}).forEach(([n, e]) => {
    const p = parseInt(e && e.pos);
    if (F1[p] && n in m) m[n] += F1[p];
  }));
  return roster.map(d => ({ ...d, pts: m[d.name] })).sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
}
function teamStandings() {
  const t = {};
  standings().forEach(d => t[d.team] = (t[d.team] || 0) + d.pts);
  return Object.entries(t).sort((a, b) => b[1] - a[1]);
}
function winnerOf(r) {
  const hit = Object.entries(RR[r.num] || {}).find(([, e]) => e && String(e.pos).trim() === '1');
  const d = hit && roster.find(x => x.name === hit[0]);
  return d ? nm(d) : null;
}
function enteredNames() { return S.persons.filter(p => p.slots && p.slots.length).map(p => p.name); }

const pp = e => { const p = e && e.pos != null ? String(e.pos).trim() : ''; return /^\d+$/.test(p) ? +p : null; };
const hasPos = e => !!e && e.pos != null && String(e.pos).trim() !== '';
const qg = e => { const q = e && e.qualGap != null ? String(e.qualGap).trim() : ''; if (!q) return { h: 0 }; if (/^(dnf|dsq|dns)$/i.test(q)) return { h: 1, dnf: 1 }; const g = parseFloat(q.replace(',', '.')); return isNaN(g) ? { h: 0 } : { h: 1, g }; };
const chrono = () => {
  const l = [], ks = o => Object.keys(o).map(Number).sort((a, b) => a - b);
  ks(SA).forEach(n => { const r = (SA[n] && SA[n].raceResults) || {}; ks(r).forEach(k => l.push(r[k])); });
  ks(RR).forEach(k => l.push(RR[k]));
  return l;
};
function elo() {
  const H = humans(), E = {}, hist = {};
  H.forEach(d => { E[d.name] = 1000; hist[d.name] = [1000]; });
  chrono().forEach(res => {
    if (!res) return;
    const en = H.map(d => ({ n: d.name, r: res[d.name] })).filter(e => hasPos(e.r));
    if (en.length < 2) return;
    const N = en.length;
    en.forEach(e => { const p = pp(e.r); e.rk = p === null ? 99 : p; e.q = qg(e.r); });
    [...en].sort((a, b) => a.rk - b.rk).forEach((e, i) => e.rs = (N - 1 - i) / (N - 1));
    const mg = Math.max(0, ...en.filter(e => e.q.h && !e.q.dnf).map(e => e.q.g));
    en.forEach(e => { e.qs = e.q.dnf ? 0 : (!e.q.h ? .5 : (mg > 0 ? 1 - e.q.g / mg : 1)); e.c = .7 * e.rs + .3 * e.qs; });
    const dl = {}; en.forEach(e => dl[e.n] = 0);
    en.forEach(a => en.forEach(b => {
      if (a === b) return;
      const ex = 1 / (1 + 10 ** ((E[b.n] - E[a.n]) / 400)), sc = a.c > b.c ? 1 : a.c < b.c ? 0 : .5;
      dl[a.n] += 28 * (sc - ex) / (N - 1);
    }));
    en.forEach(e => { E[e.n] += dl[e.n]; hist[e.n].push(E[e.n]); });
  });
  return { E, hist };
}
function careerStats() {
  const o = {}; humans().forEach(d => o[d.name] = { s: 0, f: 0, w: 0, p: 0, b: 99, ps: 0 });
  chrono().forEach(res => { if (!res) return; humans().forEach(d => {
    const e = res[d.name]; if (!hasPos(e)) return;
    const x = o[d.name], p = pp(e); x.s++;
    if (p !== null) { x.f++; x.ps += p; if (p < x.b) x.b = p; if (p === 1) x.w++; if (p <= 3) x.p++; }
  }); });
  return o;
}
function h2h(a, b) {
  const o = { n: 0, ra: 0, rb: 0, qa: 0, qb: 0 };
  chrono().forEach(res => {
    const x = res && res[a], y = res && res[b]; if (!x || !y) return; o.n++;
    if (hasPos(x) && hasPos(y)) {
      const pa = pp(x), pb = pp(y);
      if (pa !== null && pb !== null) { if (pa < pb) o.ra++; else if (pb < pa) o.rb++; }
      else if (pa !== null) o.ra++; else if (pb !== null) o.rb++;
    }
    const qa = qg(x), qb = qg(y);
    if (qa.h && qb.h && !(qa.dnf && qb.dnf)) {
      if (qa.dnf) o.qb++; else if (qb.dnf) o.qa++; else if (qa.g < qb.g) o.qa++; else if (qb.g < qa.g) o.qb++;
    }
  });
  return o;
}
function byIng(n) {
  const c = String(n || '').replace(/^(\[KI\]|_KI_)\s*/, '').trim().toLowerCase();
  return roster.find(d => d.racenet && d.racenet.toLowerCase() === c)
    || roster.find(d => !d.human && d.name.toLowerCase() === c)
    || roster.find(d => !d.human && d.name.toLowerCase().split(' ').pop() === c) || null;
}
function crossHtml() {
  const rs = races();

  const c = rctx(), full = n => roster.find(d => d.name === n) || { name: n }, col = n => TC[full(n).team] || '#888';
  const items = Object.values(RV).map(rv => ({ rv, v: ['ended', 'expired', 'queued'].includes(rv.status) ? null : RL.rvView(c, rv) }));
  const card = ({ rv, v }) => {
    const st = !v ? ({ expired: 'Verfallen, kein Platz frei geworden', queued: 'Wartet auf freien Platz, verfällt nach 2 Rennen' }[rv.status] || 'Beendet') : v.done ? 'Entschieden' : 'Aktiv';
    const ta = v ? v.ta : 0, tb = v ? v.tb : 0, pc = Math.round(ta / Math.max(ta + tb, 1) * 100);
    return `<div class="card"><div class="row" style="border:0;padding-top:0"><div class="grow"><b style="color:${col(rv.a)}">${nm(full(rv.a))}</b> gegen <b style="color:${col(rv.b)}">${nm(full(rv.b))}</b>
      <div class="sub">${RTYPE[rv.type] || 'Rivalität'}, ${st}${v && v.rows ? `, ${v.rows.length} von 3 Rennen` : ''}</div></div><div class="pts">${ta}:${tb}</div></div>
      <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0"><div style="width:${pc}%;background:${col(rv.a)}"></div><div style="width:${100 - pc}%;background:${col(rv.b)}"></div></div>
      ${v && v.done ? (v.winner ? `<div class="note gold">🥊 ${nm(full(v.winner))} gewinnt${v.ko ? ' per Knockout' : ''} und stiehlt ${v.amount} Ansehen.</div>` : '<div class="note">Unentschieden, kein Ansehen wechselt.</div>') : ''}
      ${v && v.rows && v.rows.length ? `<details><summary>Rennen im Detail</summary>${v.rows.map(r => `<div class="strat"><b>${r.country}</b> ${r.ta}:${r.tb}<div class="sub">Quali ${r.a[0]}:${r.b[0]}, schnellste Runde ${r.a[1]}:${r.b[1]}, straffrei ${r.a[2]}:${r.b[2]}, Ziel ${r.a[3]}:${r.b[3]}</div></div>`).join('')}</details>` : ''}</div>`;
  };
  const A = RL.ansehenMap(c, RV), wins = {};
  items.forEach(({ v }) => { if (v && v.done && v.winner) wins[v.winner] = (wins[v.winner] || 0) + 1; });
  const rank = [...roster].sort((x, y) => A[y.name] - A[x.name]);
  return (items.length ? items.map(card).join('') : '<div class="card"><div class="sub">Noch keine Rivalitäten. Der Admin legt sie an oder die Presse stößt sie an.</div></div>')
    + `<div class="card"><h2>Ansehen</h2>${rank.map((d, i) => { const dv = A[d.name] - 100;
      return `<div class="row"><div class="pos">${i + 1}</div><div class="bar" style="background:${TC[d.team] || '#888'}"></div>${av(d)}<div class="grow"><b>${nm(d)}</b>${wins[d.name] ? ` <span title="Rivalitätssiege">🥊×${wins[d.name]}</span>` : ''}<div class="sub">${d.human ? d.team : 'KI, ' + d.team}</div></div>
        <div class="sub" style="color:${dv > 0 ? 'var(--ok)' : dv < 0 ? 'var(--bad)' : 'var(--mu)'}">${dv ? (dv > 0 ? '+' : '') + dv : ''}</div><div class="pts" style="width:48px">${A[d.name]}</div></div>`; }).join('')}</div>`;
}
function duelHead(a, c) {
  const one = n => {
    const d = roster.find(x => x.name === n) || {}, src = d.photo || (HELM[d.team] ? `helmet_${HELM[d.team]}.png` : '');
    return `<div>${src ? `<img src="${src}" alt="" onerror="this.remove()">` : ''}<div><b style="color:${TC[d.team] || 'var(--tx)'}">${d.human || d.name || n}</b></div><div class="sub">${d.team || ''}</div></div>`;
  };
  return `<div class="dh">${one(a)}<div class="vs">VS</div>${one(c)}</div>`;
}
function renderStats() {
  const H = humans(), { E, hist } = elo(); let b = '';
  if (sv === 'riv') { b = rivHtml(); }
  else if (sv === 'elo') {
    b = `<div class="card">${[...H].sort((x, y) => E[y.name] - E[x.name]).map((d, i) => {
      const h = hist[d.name], dl = h.length > 1 ? h[h.length - 1] - h[h.length - 2] : 0;
      return `<div class="row"><div class="pos">${i + 1}</div><div class="bar" style="background:${TC[d.team] || '#888'}"></div>${av(d)}
        <div class="grow"><b>${d.human}</b><div class="sub">${d.team}, ${h.length - 1} Rennen gewertet</div></div>
        ${spark(h)}<div class="sub" style="color:${dl > 1 ? 'var(--ok)' : dl < -1 ? 'var(--bad)' : 'var(--mu)'}">${Math.abs(dl) > 1 ? (dl > 0 ? '▲ ' : '▼ ') + Math.round(Math.abs(dl)) : '–'}</div>
        <div class="pts" style="width:56px">${Math.round(E[d.name])}</div></div>`; }).join('')}</div>`;
  } else if (sv === 'car') {
    const cs = careerStats();
    b = `<div class="card" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Fahrer</th><th>Starts</th><th>Siege</th><th>Podien</th><th>Bester</th><th>Ø Platz</th><th>Ausfälle</th><th>Zuverl.</th></tr></thead><tbody>${[...H].sort((x, y) => cs[y.name].w - cs[x.name].w || cs[y.name].p - cs[x.name].p).map(d => {
      const s = cs[d.name];
      return `<tr><td>${d.human}</td><td>${s.s}</td><td><b>${s.w}</b></td><td>${s.p}</td><td>${s.b < 99 ? s.b : '-'}</td><td>${s.f ? (s.ps / s.f).toFixed(1) : '-'}</td><td>${s.s - s.f}</td><td>${s.s ? Math.round(s.f / s.s * 100) + '%' : '-'}</td></tr>`; }).join('')}</tbody></table></div>`;
  } else {
    const a = rvA || H[0].name, c = rvB && rvB !== a ? rvB : (H.find(d => d.name !== a) || H[0]).name;
    const o = h2h(a, c), opt = v => H.map(d => `<option value="${d.name}" ${d.name === v ? 'selected' : ''}>${d.human}</option>`).join('');
    const c1 = TC[(roster.find(d => d.name === a) || {}).team] || '#888', c2 = TC[(roster.find(d => d.name === c) || {}).team] || '#888';
    const rw = (l, x, y) => { const pc = Math.round(x / Math.max(x + y, 1) * 100); return `<div class="row" style="border:0;padding-bottom:2px"><div class="pts" style="width:60px">${x}</div><div class="grow sub" style="text-align:center">${l}</div><div class="pts" style="width:60px;text-align:right">${y}</div></div><div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:12px"><div style="width:${pc}%;background:${c1}"></div><div style="width:${100 - pc}%;background:${c2}"></div></div>`; };
    b = `<div class="card"><div class="pick"><select id="rvA">${opt(a)}</select><select id="rvB">${opt(c)}</select></div>${duelHead(a, c)}${o.n
      ? rw('Rennen vorn', o.ra, o.rb) + rw('Quali vorn', o.qa, o.qb) + rw('Elo', Math.round(E[a]), Math.round(E[c])) + `<div class="sub" style="margin-top:8px">Aus ${o.n} gemeinsamen Rennen, alle Saisons.</div>`
      : '<div class="sub">Noch kein gemeinsames Rennen.</div>'}</div>`;
  }
  document.getElementById('v-stats').innerHTML = `<div class="seg">${[['elo', 'Elo'], ['car', 'Karriere'], ['duel', 'Duell'], ['riv', 'Rivalen']].map(([k, l]) => `<button class="${sv === k ? 'on' : ''}" data-a="sv" data-v="${k}">${l}</button>`).join('')}</div>` + b;
}

const ls = k => { try { return localStorage.getItem(k) === '1'; } catch (e) { return false; } };
let mapFlip = { x: ls('mfx'), y: ls('mfy') }, mapZ = 1, hiCar = null, mapSig = '';
const fmtMs = ms => ms > 0 ? (ms >= 60000 ? `${Math.floor(ms / 60000)}:${String(Math.floor(ms % 60000 / 1000)).padStart(2, '0')}` : `${Math.floor(ms / 1000)}`) + '.' + String(ms % 1000).padStart(3, '0') : '-.---';
function mapProj(B) {
  const pad = 30, size = 500, sx = Math.max(B.maxX - B.minX, 1), sz = Math.max(B.maxZ - B.minZ, 1), sc = (size - pad * 2) / Math.max(sx, sz);
  const ox = pad + (size - pad * 2 - sx * sc) / 2, oy = pad + (size - pad * 2 - sz * sc) / 2;
  return (x, z) => { let a = (x - B.minX) * sc, b = (z - B.minZ) * sc; if (mapFlip.x) a = sx * sc - a; if (mapFlip.y) b = sz * sc - b; return [ox + a, oy + b]; };
}
function updateMap() {
  const c = document.getElementById('lmap'), P = LT && LT.mapPositions, B = LT && LT.mapBounds;
  if (!P || !B || B.minX == null || !Object.keys(P).length) { c.innerHTML = ''; mapSig = ''; return; }
  const pt = mapProj(B), tr = LT.mapTrace || [], sig = JSON.stringify([Object.keys(P).sort(), tr.length, B, mapFlip, hiCar, mapZ]);
  if (sig !== mapSig || !c.firstChild) {
    mapSig = sig;
    const line = tr.length > 1 ? `<polyline points="${tr.map(([x, z]) => pt(x, z).map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` : '';
    const dots = Object.entries(P).map(([k, q]) => {
      const [x, y] = pt(q.x, q.z), m = LT.drivers && LT.drivers[k], i = m && byIng(m.name), col = (i && TC[i.team]) || '#888', me = +k === LT.playerCarIndex;
      const lab = i ? (i.code || nm(i).slice(0, 3).toUpperCase()) : (m ? m.pos : '?');
      return `<g id="md${k}" class="mdot" style="transform:translate(${x.toFixed(1)}px,${y.toFixed(1)}px)" data-a="hi" data-v="${k}">${hiCar === +k ? `<circle r="13" fill="none" stroke="${col}" stroke-width="2.5"/>` : ''}<circle r="${me ? 8 : 6}" fill="${col}" stroke="${me ? '#fff' : 'rgba(255,255,255,.4)'}" stroke-width="${me ? 2.5 : 1}"/><text y="-10" text-anchor="middle" class="mlab">${lab}</text></g>`;
    }).join('');
    c.innerHTML = `<div class="card"><h2>🗺️ Live Map</h2><div class="pick"><button data-a="mz" data-v="+">＋</button><button data-a="mz" data-v="-">－</button><button data-a="mz" data-v="0">Reset</button><button class="${mapFlip.x ? 'on' : ''}" data-a="mf" data-v="x">⇄ X</button><button class="${mapFlip.y ? 'on' : ''}" data-a="mf" data-v="y">⇅ Y</button>${hiCar !== null ? `<button class="on" data-a="hi" data-v="${hiCar}">✕ Hervorhebung</button>` : ''}</div>
      <div class="mapw"><svg viewBox="0 0 500 500" width="100%" height="100%"><g transform="translate(250 250) scale(${mapZ}) translate(-250 -250)">${line}${dots}</g></svg></div>
      <div class="sub" style="margin-top:6px;text-align:center">${tr.length > 1 ? 'Ideallinie aus Runde 1 deines Autos.' : 'Streckenlinie erscheint nach deiner ersten Runde.'} Auf einen Punkt oder Fahrernamen tippen zum Hervorheben. Falls die Karte verkehrt aussieht, ⇄ oder ⇅ nutzen.</div></div>`;
  } else Object.entries(P).forEach(([k, q]) => { const d = document.getElementById('md' + k); if (d) { const [x, y] = pt(q.x, q.z); d.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`; } });
}
function strHtml() { const nx = races().find(r => !isDone(r)); return nx && TA[nx.num] ? `<div class="card"><h2>Strategie (Rennarchiv)</h2>${archiveHtml(nx, true)}</div>` : ''; }
function renderLive() {
  const el = document.getElementById('v-live');
  if (!document.getElementById('lt')) el.innerHTML = '<div id="lt"></div><div id="lmap"></div><div id="lstr"></div>';
  const lt = document.getElementById('lt');
  if (!LT || !LT.drivers) { lt.innerHTML = '<div class="card"><h2>Live-Timing</h2><div class="sub">Gerade läuft keine Session. Sobald jemand das Telemetrie-Skript startet, erscheint hier alles automatisch.</div></div>'; updateMap(); document.getElementById('lstr').innerHTML = strHtml(); return; }
  const ds = Object.entries(LT.drivers).filter(([, d]) => d.pos > 0).sort((a, b) => a[1].pos - b[1].pos);
  const tk = [...(LT.ticker || [])].reverse();
  lt.innerHTML = `<div class="card" style="overflow-x:auto"><h2>${LT.sessionActive ? '🔴 Live-Timing' : 'Letzte Session'}</h2>
    <table class="tbl"><thead><tr><th>Fahrer</th><th>Rd</th><th>Abstand</th><th>S1</th><th>S2</th><th>S3</th><th>Reifen</th><th>Box</th></tr></thead><tbody>${ds.map(([k, d]) => {
      const i = byIng(d.name), tag = d.stale ? ' (weg)' : (d.resultStatus === 4 || d.resultStatus === 6) ? ' (OUT)' : d.resultStatus === 5 ? ' (DSQ)' : '';
      return `<tr><td data-a="hi" data-v="${k}" style="cursor:pointer;border-left:4px solid ${(i && TC[i.team]) || '#888'}${hiCar === +k ? ';color:var(--gold)' : ''}">P${d.pos} <b>${i ? nm(i) : d.name}</b>${tag}</td><td>${d.lap ?? '-'}</td><td>${d.gapMs > 0 ? '+' + (d.gapMs / 1000).toFixed(3) : '-'}</td><td>${fmtMs(d.sector1Ms)}</td><td>${fmtMs(d.sector2Ms)}</td><td>${fmtMs(d.sector3Ms)}</td><td>${d.tyre || '?'}</td><td>${d.pitStops ?? 0}</td></tr>`; }).join('')}</table></div>
    <div class="card"><h2>Ticker</h2>${tk.length ? `<ul class="news">${tk.map(x => `<li>${x}</li>`).join('')}</ul>` : '<div class="sub">Keine Events bisher.</div>'}</div>`;
  updateMap(); document.getElementById('lstr').innerHTML = strHtml();
}

function render() {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + view));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  renderHome(); renderTermin(); renderWertung(); renderStats(); renderRennen(); renderLive();
}

async function copyDay(d) {
  if (!me) { msg = 'Bitte zuerst deinen Namen wählen.'; return render(); }
  const p = S.persons.find(x => x.name === me), slots = ((p && p.slots) || []).filter(x => x.date !== d).concat({ date: d, from: '14:00', to: '18:00' });
  const persons = S.persons.filter(x => x.name !== me).concat({ name: me, slots });
  try { await set(ref(db, 'renntermin/persons'), persons); if (DC[me]) await set(ref(db, 'availabilityDeclined/' + me), null); sel = slots.map(x => x.date).sort(); tm = {}; slots.forEach(x => tm[x.date] = { from: x.from, to: x.to }); msg = 'Eingetragen ✓ (14:00 bis 18:00, die Zeit kannst du oben pro Tag anpassen)'; }
  catch (e) { console.error(e); msg = 'Fehler beim Speichern.'; }
  render();
}
async function decline() {
  if (!me) { msg = 'Bitte zuerst deinen Namen wählen.'; return render(); }
  const ex = S.persons.find(p => p.name === me);
  if (ex && ex.slots && ex.slots.length) { msg = 'Du hast schon Termine eingetragen. Lösche sie zuerst, wenn du absagen willst.'; return render(); }
  try { await set(ref(db, 'availabilityDeclined/' + me), Date.now()); msg = '✅ Abgesagt, die anderen wissen Bescheid.'; me = ''; sel = []; tm = {}; }
  catch (e) { console.error(e); msg = 'Fehler beim Speichern.'; }
  render();
}
async function save() {
  if (!me) { msg = 'Bitte zuerst deinen Namen wählen.'; return render(); }
  if (!sel.length) { msg = 'Bitte mindestens einen Tag wählen.'; return render(); }
  const persons = S.persons.filter(p => p.name !== me).concat({ name: me, slots: sel.map(date => ({ date, from: tm[date].from, to: tm[date].to })) });
  try { await set(ref(db, 'renntermin/persons'), persons); if (DC[me]) await set(ref(db, 'availabilityDeclined/' + me), null); msg = 'Gespeichert ✓'; }
  catch (e) { console.error(e); msg = 'Speichern fehlgeschlagen. Bitte später erneut versuchen.'; }
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if (a === 'go') { view = v; msg = ''; scrollTo(0, 0); }
  else if (a === 'user') {
    me = v; msg = '';
    const p = S.persons.find(x => x.name === v);
    sel = p ? p.slots.map(s => s.date) : [];
    tm = {}; sel.forEach((d, i) => tm[d] = { from: p.slots[i].from, to: p.slots[i].to });
  }
  else if (a === 'day') { if (sel.includes(v)) sel = sel.filter(x => x !== v); else { sel = [...sel, v].sort(); tm[v] = tm[v] || { from: '14:00', to: '18:00' }; } }
  else if (a === 'wt') wt = v;
  else if (a === 'sv') sv = v;
  else if (a === 'rc') openRace = openRace === +v ? null : +v;
  else if (a === 'lb') { document.getElementById('lbi').src = v; document.getElementById('lb').classList.add('on'); return; }
  else if (a === 'lbx') { document.getElementById('lb').classList.remove('on'); return; }
  else if (a === 'save') return save();
  else if (a === 'decline') return decline();
  else if (a === 'copy') return copyDay(v);
  else if (a === 'hi') hiCar = hiCar === +v ? null : +v;
  else if (a === 'mz') mapZ = v === '0' ? 1 : Math.min(4, Math.max(1, mapZ * (v === '+' ? 1.4 : 1 / 1.4)));
  else if (a === 'mf') { mapFlip[v] = !mapFlip[v]; try { localStorage.setItem('mf' + v, mapFlip[v] ? '1' : '0'); } catch (e) { /* egal */ } }
  render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('tmi') && tm[t.dataset.d]) tm[t.dataset.d][t.dataset.k] = t.value;
  if (t.id === 'rvA') { rvA = t.value; render(); }
  if (t.id === 'rvB') { rvB = t.value; render(); }
});

setInterval(() => {
  const el = document.getElementById('cd');
  if (!el || !S.date) return;
  const diff = new Date(`${S.date}T${S.start || '14:00'}:00`) - Date.now();
  if (diff <= 0) { el.textContent = '🏎️ Race Day!'; if (!rdFlag) { rdFlag = true; render(); } return; }
  const d = Math.floor(diff / 864e5), h = Math.floor(diff % 864e5 / 36e5), m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3);
  el.textContent = `${d}T ${h}Std ${m}Min ${s}Sek`;
}, 1000);

const on = (p, f) => onValue(ref(db, p), snap => { f(snap.val()); render(); }, err => console.error(p, err));
on('renntermin', v => {
  S = { persons: toArr(v && v.persons), date: v && v.confirmedDate, start: v && v.confirmedStart, end: v && v.confirmedEnd };
  const st = document.getElementById('st'); st.textContent = 'Live'; st.classList.add('live');
  cleanupPast().then(ch => { if (!ch) autoConfirm(); });
});
on('raceResults', v => RR = v || {});
on('seasons', v => SA = v || {});
on('liveTiming', v => LT = v);
on('raceStatus', v => RS = v || {});
on('trackRecords', v => TR = v || {});
on('telemetryArchive', v => { TA = v || {}; syncRecords(); });
on('siteSettings', v => { DS = v || {}; applyDesign(); });
on('availabilityDeclined', v => DC = v || {});
on('rivalries', v => RV = v || {});
on('rivalryNews', v => RN = v || {});
on('driverRoster', v => { const l = toArr(v); roster = l.length ? l : DEF; });
on('raceCalendarCodes', v => { const l = toArr(v); cal = l.length ? l : null; });
render();
</script>
