<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurkensöhne Cup 2026</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151922;
      --s3: #1f2430;
      --border: #2a3142;
      --text: #f0f4fc;
      --m: #8a99ad;
      --m2: #5c6878;
      --m3: #3b4453;
      --y: #ffd700;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; font-size: 14px; }
    
    /* 1. Ausnutzung der Bildschirmbreite */
    .app-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, #1e2430 0%, #0e121a 100%);
      border: 1px solid var(--border);
      border-left: 4px solid var(--y);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .hero-title { font-size: 0.8rem; color: var(--m); text-transform: uppercase; letter-spacing: 1px; }
    .hero-race-name { font-size: 1.4rem; font-weight: 800; color: #fff; }
    .hero-countdown { font-size: 1.2rem; font-weight: 700; color: var(--y); font-family: monospace; }
    .hero-weather { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--m); }

    /* Grid Layouts */
    .main-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 992px) {
      .main-grid { grid-template-columns: 320px 1fr; }
    }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

    /* WM Standings & Search */
    .search-bar { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; margin-bottom: 12px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { padding: 6px 14px; background: var(--s3); border: none; border-radius: 6px; color: var(--m); cursor: pointer; font-weight: 600; }
    .tab-btn.active { background: var(--y); color: #000; }

    /* 2. Podium Highlights */
    .standings-row { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); gap: 12px; cursor: pointer; transition: background 0.2s; border-radius: 8px; }
    .standings-row:hover { background: var(--s3); }
    .st-pos { font-weight: 800; width: 24px; text-align: center; }
    
    .standings-row.p1 { border: 1px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
    .standings-row.p1 .st-pos { color: var(--gold); }
    .standings-row.p2 { border: 1px solid var(--silver); background: rgba(192, 192, 192, 0.05); }
    .standings-row.p2 .st-pos { color: var(--silver); }
    .standings-row.p3 { border: 1px solid var(--bronze); background: rgba(205, 127, 50, 0.05); }
    .standings-row.p3 .st-pos { color: var(--bronze); }

    .st-driver { flex: 1; display: flex; align-items: center; }
    .st-pts-wrap { text-align: right; }
    .st-pts { font-weight: 700; font-size: 1.1rem; }
    .st-pts-lbl { font-size: 0.65rem; color: var(--m2); }

    /* Race Calendar */
    .race-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
    .race-row:hover { background: var(--s3); }
    .race-row.next { background: rgba(255, 215, 0, 0.1); border: 1px solid var(--y); }

    /* Modals (Popups) */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 90%; max-width: 500px; position: relative; }
    .modal-close { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--m); font-size: 1.2rem; cursor: pointer; }

    #loadingOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); display:flex; justify-content:center; align-items:center; z-index:999; }
    .dot { width:10px; height:10px; background:#4ff; border-radius:50%; display:inline-block; }
    .dot.live { background:#27f4d2; box-shadow:0 0 8px #27f4d2; }
  </style>
</head>
<body>

<div id="loadingOverlay">Lade Daten...</div>

<div class="app-container">
  
  <!-- Status Header -->
  <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.8rem; color:var(--m);">
    <div><span id="statusDot" class="dot"></span> <span id="statusText">Verbinde...</span></div>
    <div>Gurkensöhne F1 League 2026</div>
  </div>

  <!-- 1. "Next Race" Hero-Banner -->
  <div class="hero-banner">
    <div>
      <div class="hero-title">Nächstes Event</div>
      <div class="hero-race-name" id="heroRaceName">GP von Japan (Suzuka)</div>
    </div>
    <div>
      <div class="hero-title" style="text-align:right;">Start-Countdown</div>
      <div class="hero-countdown" id="heroCountdown">02T : 14H : 30M</div>
    </div>
    <div class="hero-weather">
      <span>🌤️ 22°C</span>
      <span style="color:var(--m2);">| Regenrisiko: 10%</span>
    </div>
  </div>

  <div class="main-grid">
    <!-- Links: Rennkalender -->
    <div class="card">
      <div class="card-title">🏁 Rennkalender</div>
      <div id="calendarContent"></div>
    </div>

    <!-- Rechts: WM-Stand mit Podium & Suche -->
    <div class="card">
      <div class="card-title">
        <span>🏆 Weltmeisterschaft</span>
        <div class="tabs">
          <button class="tab-btn active" id="tabFahrer" onclick="switchTab('fahrer')">Fahrer</button>
          <button class="tab-btn" id="tabKonstrukteur" onclick="switchTab('konstrukteur')">Teams</button>
        </div>
      </div>

      <!-- Suche & Filter -->
      <input type="text" id="driverSearch" class="search-bar" placeholder="🔍 Fahrer oder Team suchen..." oninput="renderStandings()">

      <div id="standingsContent"></div>
    </div>
  </div>
</div>

<!-- Fahrer-Profil Modal -->
<div class="modal-overlay" id="driverModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('driverModal')">✕</button>
    <div id="driverModalBody"></div>
  </div>
</div>

<!-- Renn-Details Modal -->
<div class="modal-overlay" id="raceModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('raceModal')">✕</button>
    <div id="raceModalBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDDfD7PAl2RoeeSvzp6KnLHw1-ojEeYLaA",
  authDomain: "gurkensohne-cup.firebaseapp.com",
  databaseURL: "https://gurkensohne-cup-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gurkensohne-cup",
  storageBucket: "gurkensohne-cup.firebasestorage.app",
  messagingSenderId: "395947948221",
  appId: "1:395947948221:web:8b201ab21470678caa9fd4",
  measurementId: "G-VG2JMMMEJH"
};

const TEAM_COLORS = {
  'Ferrari':'#e8002d','McLaren':'#ff8000','Red Bull':'#3671c6',
  'Mercedes-AMG Petronas':'#27f4d2','Aston Martin':'#358c75','Alpine':'#ff87bc',
  'Williams':'#64c4ff','Visa Cash App RB':'#6692ff','Kick Sauber':'#52e252','Haas':'#b6babd',
};

const ALL_DRIVERS = [
  { name:'Timotheus Müller',    racenet:'RealSuetomit',    team:'Visa Cash App RB',       human:'Timo',    photo:'timotheus-mueller-racingbulls.png', wins: 2, podiums: 3 },
  { name:'Pascale Braasch',     racenet:'lafillederue',    team:'Visa Cash App RB',       human:'Pascale', photo:'pascale-braasch-racingbulls.png', wins: 0, podiums: 2 },
  { name:'Niklas Schweisfurth', racenet:'niklasschwei',    team:'Aston Martin',           human:'Niklas',  photo:'niklas-schweisfurth-astonmartin.png', wins: 1, podiums: 1 },
  { name:'Tim Löffler',         racenet:'loeffel00',       team:'Kick Sauber',            human:'Tim',     photo:'tim-loeffler-kicksauber.png', wins: 0, podiums: 0 },
  { name:'Marcel Walle',        racenet:'Bidox2',          team:'Red Bull',               human:'Marcel',  photo:'marcel-walle-redbull-removebg-preview.png', wins: 0, podiums: 0 },
  { name:'Yannis Herling',      racenet:'HenkelPog',       team:'Alpine',                 human:'Yannis',  photo:'yannis-herling-alpine.png', wins: 0, podiums: 0 },
  { name:'Eric Walter',         racenet:'PotatokingDE',    team:'Ferrari',                human:'Eric',    photo:'eric-walter-ferrari.png', wins: 0, podiums: 0 },
  { name:'Philipp Juny',        racenet:'beiunszuhause',   team:'McLaren',                human:'Philipp', photo:'philipp-juny-mclaren.png', wins: 0, podiums: 0 },
  { name:'Charles Leclerc',     racenet:null,              team:'Ferrari',                human:null,      photo:'charles-leclerc-ferrari.png', wins: 0, podiums: 1 },
  { name:'Lando Norris',        racenet:null,              team:'McLaren',                human:null,      photo:'lando-norris-mclaren.png', wins: 0, podiums: 1 },
];

const INITIAL_STANDINGS = [
  {name:'Timotheus Müller', points:50},
  {name:'Charles Leclerc', points:28},
  {name:'Pascale Braasch', points:23},
  {name:'Lando Norris', points:19},
  {name:'Niklas Schweisfurth', points:18},
  {name:'Tim Löffler', points:8},
  {name:'Marcel Walle', points:6},
  {name:'Yannis Herling', points:1},
  {name:'Eric Walter', points:0},
  {name:'Philipp Juny', points:0}
];

const RACES = [
  { num:1, cc:'au', country:'Australien', city:'Melbourne', done:true, winner:'Timotheus Müller' },
  { num:2, cc:'cn', country:'China', city:'Shanghai', done:true, winner:'Timotheus Müller' },
  { num:3, cc:'jp', country:'Japan', city:'Suzuka', done:false, date:'2026-08-02T15:00:00' },
  { num:4, cc:'bh', country:'Bahrain', city:'Sachir', done:false },
  { num:5, cc:'sa', country:'Saudi-Arabien', city:'Dschidda', done:false },
];

let standings = { drivers: INITIAL_STANDINGS, racesCompleted: 2 };
let standingsTab = 'fahrer';

// INIT FIREBASE
try {
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  document.getElementById('loadingOverlay').style.display='none';
  document.getElementById('statusDot').classList.add('live');
  document.getElementById('statusText').textContent='Live verbunden';
} catch(e) {
  document.getElementById('loadingOverlay').style.display='none';
  document.getElementById('statusText').textContent='Lokal gestartet';
}

// ── RENDER HERO BANNER COUNTDOWN ─────────────────────────────────────────────
function initCountdown() {
  const nextRace = RACES.find(r => !r.done);
  if(!nextRace || !nextRace.date) return;

  document.getElementById('heroRaceName').textContent = `GP von ${nextRace.country} (${nextRace.city})`;

  setInterval(() => {
    const target = new Date(nextRace.date).getTime();
    const now = new Date().getTime();
    const diff = target - now;

    if(diff <= 0) {
      document.getElementById('heroCountdown').textContent = "Rennen läuft!";
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

    document.getElementById('heroCountdown').textContent = 
      `${String(d).padStart(2,'0')}T : ${String(h).padStart(2,'0')}H : ${String(m).padStart(2,'0')}M`;
  }, 1000);
}

// ── RENDER STANDINGS WITH PODIUM & SEARCH ────────────────────────────────────
window.renderStandings = function() {
  const el = document.getElementById('standingsContent');
  const query = document.getElementById('driverSearch')?.value.toLowerCase() || '';

  let sorted = [...standings.drivers].sort((a,b) => b.points - a.points);

  if(query) {
    sorted = sorted.filter(d => {
      const info = ALL_DRIVERS.find(x => x.name === d.name);
      return d.name.toLowerCase().includes(query) || info?.team.toLowerCase().includes(query);
    });
  }

  el.innerHTML = sorted.map((d, i) => {
    const info = ALL_DRIVERS.find(x => x.name === d.name) || { team: 'Unbekannt' };
    const posClass = i === 0 ? 'p1' : i === 1 ? 'p2' : i === 2 ? 'p3' : '';
    const badge = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}`;

    return `
      <div class="standings-row ${posClass}" onclick="openDriverModal('${d.name}')">
        <div class="st-pos">${badge}</div>
        <div class="st-driver">
          <div>
            <div style="font-weight:700;">${d.name}</div>
            <div style="font-size:0.7rem; color:${TEAM_COLORS[info.team] || '#888'};">${info.team}</div>
          </div>
        </div>
        <div class="st-pts-wrap">
          <div class="st-pts">${d.points}</div>
          <div class="st-pts-lbl">PTS</div>
        </div>
      </div>
    `;
  }).join('');
};

// ── MODALS (FAHRER & RENNEN) ─────────────────────────────────────────────────
window.openDriverModal = function(name) {
  const driver = ALL_DRIVERS.find(d => d.name === name) || { name, team: 'N/A', wins: 0, podiums: 0 };
  const points = standings.drivers.find(d => d.name === name)?.points || 0;

  document.getElementById('driverModalBody').innerHTML = `
    <h2>${driver.name}</h2>
    <p style="color:${TEAM_COLORS[driver.team]}; font-weight:bold; margin-bottom: 15px;">${driver.team}</p>
    <hr style="border-color:var(--border); margin-bottom:15px;">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
      <div class="card" style="text-align:center;">
        <div style="font-size:1.4rem; font-weight:bold; color:var(--y);">${points}</div>
        <div style="font-size:0.7rem; color:var(--m);">Punkte</div>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-size:1.4rem; font-weight:bold;">${driver.wins}</div>
        <div style="font-size:0.7rem; color:var(--m);">Siege</div>
      </div>
    </div>
  `;
  document.getElementById('driverModal').style.display = 'flex';
};

window.openRaceModal = function(num) {
  const race = RACES.find(r => r.num === num);
  document.getElementById('raceModalBody').innerHTML = `
    <h2>${race.country} GP (${race.city})</h2>
    <p style="margin-bottom:15px; color:var(--m);">Status: ${race.done ? 'Beendet' : 'Ausstehend'}</p>
    ${race.done ? `<p>🏆 Sieger: <strong>${race.winner}</strong></p>` : '<p>Das Rennen hat noch nicht stattgefunden.</p>'}
  `;
  document.getElementById('raceModal').style.display = 'flex';
};

window.closeModal = function(id) {
  document.getElementById(id).style.display = 'none';
};

// ── CALENDAR ─────────────────────────────────────────────────────────────────
function renderCalendar() {
  const el = document.getElementById('calendarContent');
  el.innerHTML = RACES.map(r => `
    <div class="race-row ${!r.done ? 'next' : ''}" onclick="openRaceModal(${r.num})">
      <div style="font-weight:bold; width:20px;">${r.num}</div>
      <div style="flex:1;">
        <div>${r.country}</div>
        <div style="font-size:0.7rem; color:var(--m2);">${r.city}</div>
      </div>
      <div>${r.done ? '✓' : '⚡ Next'}</div>
    </div>
  `).join('');
}

// ── INIT ─────────────────────────────────────────────────────────────────────
renderCalendar();
renderStandings();
initCountdown();
</script>
</body>
</html>
