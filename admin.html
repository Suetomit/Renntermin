<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin, Gurkensöhne Cup</title>
<style>
:root{--bg:#0e1a14;--card:#16271e;--line:#25392d;--tx:#eef2e6;--mu:#93a698;--gold:#ffd23f;--ok:#5ee08a;--bad:#ff7b6b;--hd:Bahnschrift,"Roboto Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:var(--bg);padding:env(safe-area-inset-top) 0 40px}
#app{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font:800 1.2rem var(--hd)}
.top a,.lnk{color:var(--gold);font:600 .85rem system-ui;background:none;border:0;cursor:pointer;margin-left:12px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font:800 1.15rem var(--hd);margin-bottom:10px}
.sub{color:var(--mu);font-size:.85rem}
input,select{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px;font-size:.95rem;width:100%}
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.85)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--gold)}
.btn{display:block;width:100%;background:var(--gold);color:#1a1400;border:0;border-radius:10px;padding:12px;font:700 .95rem system-ui;cursor:pointer;margin-top:14px}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.red{background:#e10600;color:#fff}
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.seg button,.pick button,.mini{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:10px;padding:8px 12px;font:600 .85rem system-ui;cursor:pointer;white-space:nowrap}
.seg button.on,.pick button.on,.mini.on{background:var(--gold);color:#1a1400;border-color:var(--gold)}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border:0}
.grow{flex:1;min-width:0}
.rr{display:grid;grid-template-columns:1fr 78px 96px 34px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.del{color:var(--bad);background:none;border:0;cursor:pointer;font-size:.85rem}
.msg{margin-top:8px;font-size:.9rem;color:var(--gold);min-height:1.3em}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const fb = initializeApp({
  apiKey: "AIzaSyDDfD7PAl2RoeeSvzp6KnLHw1-ojEeYLaA",
  authDomain: "gurkensohne-cup.firebaseapp.com",
  databaseURL: "https://gurkensohne-cup-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gurkensohne-cup",
  appId: "1:395947948221:web:8b201ab21470678caa9fd4"
});
const db = getDatabase(fb), auth = getAuth(fb);

const TEAMS = ['Ferrari', 'McLaren', 'Red Bull', 'Mercedes-AMG Petronas', 'Aston Martin', 'Alpine', 'Williams', 'Visa Cash App RB', 'Kick Sauber', 'Haas'];
const MASTER = 'AUS|Australien|Melbourne;CHN|China|Shanghai;JPN|Japan|Suzuka;BHR|Bahrain|Sachir;SAU|Saudi-Arabien|Dschidda;MIA|USA|Miami;IMO|Emilia-Romagna|Imola;MCO|Monaco|Monte Carlo;ESP|Spanien|Barcelona;CAN|Kanada|Montreal;AUT|Österreich|Spielberg;GBR|Großbritannien|Silverstone;BEL|Belgien|Spa-Francorchamps;HUN|Ungarn|Hungaroring;NLD|Niederlande|Zandvoort;ITA|Italien|Monza;AZE|Aserbaidschan|Baku;SGP|Singapur|Singapur;USA|USA|Austin;MEX|Mexiko|Mexiko-Stadt;BRA|Brasilien|São Paulo;VGS|USA|Las Vegas;QAT|Katar|Lusail;UAE|Ver. Arab. Emirate|Abu Dhabi'
  .split(';').map(s => { const [code, country, city] = s.split('|'); return { code, country, city }; });
const DEF = 'Timotheus Müller|Visa Cash App RB|Timo;Pascale Braasch|Visa Cash App RB|Pascale;Niklas Schweisfurth|Aston Martin|Niklas;Tim Löffler|Kick Sauber|Tim;Marcel Walle|Red Bull|Marcel;Yannis Herling|Alpine|Yannis;Eric Walter|Ferrari|Eric;Philipp Juny|McLaren|Philipp;Charles Leclerc|Ferrari|;Lando Norris|McLaren|;Andrea Kimi Antonelli|Mercedes-AMG Petronas|;Max Verstappen|Red Bull|;George Russell|Mercedes-AMG Petronas|;Alex Albon|Williams|;Carlos Sainz|Williams|;Pierre Gasly|Alpine|;Oliver Bearman|Haas|;Nico Hulkenberg|Kick Sauber|;Esteban Ocon|Haas|;Lance Stroll|Aston Martin|'
  .split(';').map(s => { const [name, team, human] = s.split('|'); return { name, team, human: human || null }; });

const $ = id => document.getElementById(id);
const toArr = v => v ? (Array.isArray(v) ? v : Object.values(v)) : [];
const esc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmt = s => new Date(s + 'T00:00:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });

let U = null, tab = 'res', rn = 1, S = { persons: [] }, RR = {}, RS = {}, SA = {}, roster = null, cal = null, season = 1, DS = {};
let rd = null, cd = null, pickD = '', ts = '14:00', te = '18:00', msg = '', started = false;

const races = () => (cal || MASTER.map(m => m.code)).map((c, i) => ({ ...MASTER.find(m => m.code === c), num: i + 1 })).filter(r => r.code);

function start() {
  if (started) return; started = true;
  const on = (p, f) => onValue(ref(db, p), s => { f(s.val()); paint(); }, () => { msg = 'Lesefehler bei ' + p; paint(); });
  on('renntermin', v => S = { persons: toArr(v && v.persons), date: v && v.confirmedDate, start: v && v.confirmedStart, end: v && v.confirmedEnd });
  on('raceResults', v => RR = v || {});
  on('raceStatus', v => RS = v || {});
  on('seasons', v => SA = v || {});
  on('currentSeason', v => season = v || 1);
  on('siteSettings', v => DS = v || {});
  on('driverRoster', v => { const l = toArr(v); roster = l.length ? l : null; rd = null; });
  on('raceCalendarCodes', v => { const l = toArr(v); cal = l.length ? l : null; cd = null; });
}
// Nicht neu zeichnen, während gerade getippt wird (sonst gehen Eingaben verloren)
function paint() { const a = document.activeElement; if (a && /INPUT|SELECT/.test(a.tagName) && U) return; render(); }

async function w(fn, ok) {
  try { await fn(); msg = ok; } catch (e) { console.error(e); msg = 'Fehler: ' + (e.code === 'PERMISSION_DENIED' || /permission/i.test(e.message) ? 'keine Berechtigung (Login prüfen)' : e.message); }
  render();
}

// ---------- Abschnitte ----------
function secRes() {
  const rs = races(); if (!rs.find(r => r.num === rn)) rn = rs[0].num;
  const cur = RR[rn] || {};
  return `<div class="card"><h2>Rennergebnis eintragen</h2>
    <select id="rsel">${rs.map(r => `<option value="${r.num}" ${r.num === rn ? 'selected' : ''}>#${r.num} ${r.country} (${r.code})</option>`).join('')}</select>
    <div class="sub" style="margin:8px 0">Platz (1 bis 20 oder DNF), Quali-Abstand zur Pole in Sekunden (oder DNF), ⚡ = schnellste Runde.</div>
    ${(roster || DEF).map((d, i) => { const e = cur[d.name] || {};
      return `<div class="rr"><b>${esc(d.human || d.name)}</b><input class="rp" data-i="${i}" placeholder="Platz" value="${esc(e.pos)}"><input class="rq" data-i="${i}" placeholder="Quali-Gap" value="${esc(e.qualGap)}"><input type="radio" name="fl" value="${i}" ${e.fastestLap ? 'checked' : ''} aria-label="Schnellste Runde"></div>`; }).join('')}
    <button class="btn" data-a="saveRes">Ergebnis speichern</button>
    <button class="btn ghost" data-a="nofl">Schnellste Runde abwählen</button></div>`;
}
async function saveRes() {
  const o = {}, fl = document.querySelector('input[name=fl]:checked');
  (roster || DEF).forEach((d, i) => {
    const p = document.querySelector(`.rp[data-i="${i}"]`).value.trim(), q = document.querySelector(`.rq[data-i="${i}"]`).value.trim(), f = !!fl && +fl.value === i;
    if (p || q || f) o[d.name] = { pos: p, qualGap: q, fastestLap: f };
  });
  await w(() => set(ref(db, 'raceResults/' + rn), Object.keys(o).length ? o : null), 'Ergebnis gespeichert ✓');
}

function secCal() {
  if (!cd) cd = cal ? [...cal] : MASTER.map(m => m.code);
  return `<div class="card"><h2>Rennkalender dieser Saison</h2>
    <div class="sub">Haken setzen, mit ▲▼ sortieren, Rennen als gefahren markieren. Beim Umsortieren ändern sich die Rennnummern, das bitte nur vor Saisonstart tun.</div>
    ${MASTER.map(m => { const i = cd.indexOf(m.code), inc = i >= 0, num = i + 1, done = inc && !!RS[num];
      return `<div class="row" style="${inc ? '' : 'opacity:.45'}"><input type="checkbox" data-a="tc" data-v="${m.code}" ${inc ? 'checked' : ''} aria-label="${m.country}">
        <div class="grow">${inc ? num + '. ' : ''}${m.country} <span class="sub">${m.city}</span></div>
        ${inc ? `<button class="mini" data-a="mv" data-v="${m.code}" data-d="-1">▲</button><button class="mini" data-a="mv" data-v="${m.code}" data-d="1">▼</button><button class="mini ${done ? 'on' : ''}" data-a="dn" data-v="${num}">${done ? '✓ gefahren' : 'offen'}</button>` : ''}</div>`; }).join('')}
    <button class="btn" data-a="saveCal">Kalender speichern</button></div>`;
}

function secDrv() {
  if (!rd) rd = (roster || DEF).map(d => ({ name: d.name, racenet: d.racenet || '', team: d.team, human: d.human || '', code: d.code || '', photo: d.photo || '' }));
  return `<div class="card"><h2>Fahrer</h2>
    ${roster ? '' : '<div class="sub" style="color:var(--gold)">In Firebase ist noch kein Roster gespeichert. Das hier ist die Standardliste, bitte Racenet-Namen ergänzen und speichern.</div>'}
    <div class="sub">Liga-Name leer lassen = KI-Fahrer. Wird der volle Name geändert, passen alte Ergebnisse nicht mehr zu diesem Fahrer.</div></div>
    ${rd.map((d, i) => `<div class="card"><div class="g2"><input data-i="${i}" data-k="name" value="${esc(d.name)}" placeholder="Voller Name"><input data-i="${i}" data-k="racenet" value="${esc(d.racenet)}" placeholder="Racenet-/Ingame-Name"></div>
      <div class="g2"><select data-i="${i}" data-k="team">${TEAMS.map(t => `<option ${d.team === t ? 'selected' : ''}>${t}</option>`).join('')}</select><input data-i="${i}" data-k="human" value="${esc(d.human)}" placeholder="Liga-Name (leer = KI)"></div>
      <div class="g2"><input data-i="${i}" data-k="code" maxlength="3" value="${esc(d.code)}" placeholder="Code, 3 Buchstaben"><input data-i="${i}" data-k="photo" value="${esc(d.photo)}" placeholder="Foto-Dateiname"></div>
      <button class="del" data-a="del" data-v="${i}">✕ Fahrer entfernen</button></div>`).join('')}
    <button class="btn ghost" data-a="add">+ Fahrer hinzufügen</button>
    <button class="btn" data-a="saveRos">Fahrer speichern</button>`;
}

function secTerm() {
  const today = iso(new Date()), m = {}, n = (roster || DEF).filter(d => d.human).length;
  S.persons.forEach(p => (p.slots || []).forEach(s => { if (s.date >= today) (m[s.date] = m[s.date] || []).push(p.name); }));
  const ds = Object.keys(m).sort((a, b) => m[b].length - m[a].length || a.localeCompare(b));
  return `<div class="card"><h2>Renntermin</h2>
    ${S.date ? `<div>Aktuell: <b>${fmt(S.date)}</b>, ${S.start} bis ${S.end} Uhr <button class="del" data-a="unconf">Termin aufheben</button></div>` : '<div class="sub">Kein Termin festgelegt.</div>'}
    <div class="sub" style="margin-top:12px">Tag wählen (Anzahl Zusagen in Klammern):</div>
    <div class="pick">${ds.length ? ds.map(d => `<button class="${pickD === d ? 'on' : ''}" data-a="pd" data-v="${d}">${fmt(d)} (${m[d].length}/${n})</button>`).join('') : '<span class="sub">Noch keine Einträge.</span>'}</div>
    <div class="g2"><input type="time" id="ts" value="${ts}"><input type="time" id="te" value="${te}"></div>
    <button class="btn" data-a="conf">Termin festlegen</button></div>
    <div class="card"><h2>Verfügbarkeiten</h2><div class="sub">${S.persons.length} Fahrer haben eingetragen.</div>
    <button class="btn red" data-a="rst">Alle Verfügbarkeiten und den Termin zurücksetzen</button></div>`;
}

function secSea() {
  const done = Object.keys(RR).filter(k => RR[k] && Object.keys(RR[k]).length).length, arch = Object.keys(SA).map(Number).sort((a, b) => a - b);
  return `<div class="card"><h2>Saison ${season}</h2><div class="sub">${done} von ${races().length} Rennen mit Ergebnissen.</div>
    <button class="btn red" data-a="newSeason">Saison ${season} beenden und Saison ${season + 1} starten</button>
    <div class="sub" style="margin-top:10px">Ergebnisse, Status und Punktestand werden zurückgesetzt. Elo und Streckenrekorde bleiben erhalten, die alte Saison wird archiviert.</div></div>
    ${arch.length ? `<div class="card"><h2>Archiv</h2>${arch.map(n => `<div class="row">Saison ${n}<span class="sub grow" style="text-align:right">${Object.keys((SA[n] && SA[n].raceResults) || {}).length} Rennen, beendet am ${new Date(SA[n].endedAt).toLocaleDateString('de-DE')}</span></div>`).join('')}</div>` : ''}`;
}

function secDes() {
  const d = DS || {};
  return `<div class="card"><h2>Design der Seite</h2>
    <div class="sub" style="margin-bottom:10px">Hintergrundbild: Dateiname aus deinem Repo (z.B. header_banner.png) oder ein https-Link. Leer = einfarbig.</div>
    <input id="ds_bg" value="${esc(d.bg)}" placeholder="Dateiname oder Link">
    <div class="sub" style="margin:14px 0 4px">Abdunklung des Hintergrunds: <b id="ds_dv">${d.dim ?? 60}</b> %</div>
    <input type="range" id="ds_dim" min="0" max="90" value="${d.dim ?? 60}" oninput="document.getElementById('ds_dv').textContent=this.value">
    <div class="sub" style="margin:14px 0 4px">Akzentfarbe (Buttons, Hervorhebungen)</div>
    <input type="color" id="ds_acc" value="${d.accent || '#ffd23f'}" style="height:44px;padding:4px">
    <button class="btn" data-a="saveDes">Design speichern</button>
    <button class="btn ghost" data-a="resetDes">Auf Standard zurücksetzen</button>
    <div class="sub" style="margin-top:10px">Wirkt sofort auf index_v2.html, ein Neuladen der Seite reicht.</div></div>`;
}
const SEC = { res: secRes, cal: secCal, drv: secDrv, term: secTerm, sea: secSea, des: secDes };
const TABS = [['res', '🏁 Ergebnisse'], ['cal', '🗓️ Kalender'], ['drv', '🏎️ Fahrer'], ['term', '📅 Termin'], ['sea', '🏆 Saison'], ['des', '🎨 Design']];

function render() {
  const a = $('app');
  if (!U) {
    a.innerHTML = `<div class="card" style="margin-top:60px"><h2>Admin-Login</h2>
      <input type="email" id="em" placeholder="E-Mail" autocomplete="username" style="margin-bottom:8px"><input type="password" id="pw" placeholder="Passwort" autocomplete="current-password">
      <button class="btn" data-a="in">Anmelden</button><div class="msg">${msg}</div></div>`;
    return;
  }
  a.innerHTML = `<div class="top"><span>⚙️ Admin</span><span><a href="index_v2.html">zur Seite</a><button class="lnk" data-a="out">Abmelden</button></span></div>
    <div class="seg">${TABS.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-a="tab" data-v="${k}">${l}</button>`).join('')}</div>
    ${SEC[tab]()}<div class="msg">${msg}</div>`;
}

// ---------- Aktionen ----------
const A = {
  in: async () => { try { await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); msg = ''; } catch (e) { msg = 'Anmeldung fehlgeschlagen. E-Mail oder Passwort prüfen.'; } },
  out: () => signOut(auth),
  tab: t => { tab = t.dataset.v; msg = ''; },
  saveRes,
  nofl: () => { document.querySelectorAll('input[name=fl]').forEach(r => r.checked = false); return 'keep'; },
  tc: t => { const c = t.dataset.v, i = cd.indexOf(c); if (i >= 0) { if (cd.length > 1) cd.splice(i, 1); } else cd.push(c); },
  mv: t => { const i = cd.indexOf(t.dataset.v), j = i + +t.dataset.d; if (i >= 0 && j >= 0 && j < cd.length) [cd[i], cd[j]] = [cd[j], cd[i]]; },
  dn: async t => {
    const num = +t.dataset.v, nv = !RS[num];
    await w(async () => {
      await set(ref(db, 'raceStatus/' + num), nv);
      const nx = races().find(r => !(r.num === num ? nv : RS[r.num]));
      await set(ref(db, 'currentRaceNumber'), nx ? nx.num : null);
    }, nv ? 'Als gefahren markiert ✓' : 'Zurückgesetzt ✓');
  },
  saveCal: () => w(() => set(ref(db, 'raceCalendarCodes'), cd), 'Kalender gespeichert ✓'),
  add: () => rd.push({ name: 'Neuer Fahrer', racenet: '', team: TEAMS[0], human: '', code: '', photo: '' }),
  del: t => { const d = rd[+t.dataset.v]; if (confirm(`"${d.name}" wirklich entfernen?`)) rd.splice(+t.dataset.v, 1); },
  saveRos: () => {
    if (!rd.length) { msg = 'Die Fahrerliste darf nicht leer sein.'; return; }
    const out = rd.map(d => ({ name: d.name.trim(), racenet: d.racenet.trim() || null, team: d.team, human: d.human.trim() || null, code: d.code.trim().toUpperCase() || null, photo: d.photo.trim() || '' }));
    return w(() => set(ref(db, 'driverRoster'), out), 'Fahrer gespeichert ✓');
  },
  pd: t => { pickD = t.dataset.v; },
  conf: () => {
    if (!pickD) { msg = 'Bitte zuerst einen Tag wählen.'; return; }
    return w(async () => { await set(ref(db, 'renntermin/confirmedDate'), pickD); await set(ref(db, 'renntermin/confirmedStart'), ts); await set(ref(db, 'renntermin/confirmedEnd'), te); }, 'Termin festgelegt ✓');
  },
  unconf: () => confirm('Renntermin wirklich aufheben?') && w(async () => { for (const k of ['confirmedDate', 'confirmedStart', 'confirmedEnd']) await set(ref(db, 'renntermin/' + k), null); }, 'Termin aufgehoben ✓'),
  rst: () => confirm('ALLE Verfügbarkeiten und den Termin zurücksetzen?') && w(() => set(ref(db, 'renntermin'), null), 'Zurückgesetzt ✓'),
  saveDes: () => w(() => set(ref(db, 'siteSettings'), { bg: $('ds_bg').value.trim() || null, dim: +$('ds_dim').value, accent: $('ds_acc').value }), 'Design gespeichert ✓'),
  resetDes: () => w(() => set(ref(db, 'siteSettings'), null), 'Zurückgesetzt ✓'),
  newSeason: () => {
    if (!confirm(`Saison ${season} beenden und archivieren? Ergebnisse und Punktestand werden zurückgesetzt, die Elo bleibt.`)) return;
    return w(async () => {
      await set(ref(db, 'seasons/' + season), { raceResults: RR, calendarCodes: cal || MASTER.map(m => m.code), endedAt: Date.now() });
      await set(ref(db, 'currentSeason'), season + 1);
      for (const p of ['raceResults', 'raceStatus', 'currentRaceNumber', 'standings']) await set(ref(db, p), null);
    }, `Saison ${season + 1} gestartet ✓`);
  }
};

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a]'); if (!t || !A[t.dataset.a]) return;
  const r = await A[t.dataset.a](t);
  if (r !== 'keep') render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rsel') { rn = +t.value; render(); }
  else if (t.dataset.k && rd) rd[+t.dataset.i][t.dataset.k] = t.value;
  else if (t.id === 'ts') ts = t.value;
  else if (t.id === 'te') te = t.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pw') A.in().then(render); });

onAuthStateChanged(auth, u => { U = u; if (u) start(); render(); });
render();
</script>
</body>
</html>
