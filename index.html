<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gurkensöhne Cup 2026</title>
<style>
:root{--bg:#0e1a14;--card:#16271e;--line:#25392d;--tx:#eef2e6;--mu:#93a698;--gold:#ffd23f;--ok:#5ee08a;--bad:#ff7b6b;
--hd:Bahnschrift,"Roboto Condensed","Arial Narrow",system-ui,sans-serif;--bd:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font:15px/1.45 var(--bd);color:var(--tx);background:var(--bg);padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;max-width:760px;margin:0 auto;padding:14px 16px}
.brand{display:flex;align-items:center;gap:10px;font:800 1.2rem var(--hd)}
.brand img{height:34px}
.st{font-size:.8rem;color:var(--mu)}.st:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#e8a33d;margin-right:6px}
.st.live:before{background:var(--ok)}
main{max-width:760px;margin:0 auto;padding:0 16px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font:800 1.15rem var(--hd);margin-bottom:10px}
.sub{color:var(--mu);font-size:.85rem}
.hero{border-radius:18px;padding:22px 18px;margin-bottom:14px;background-size:cover;background-position:center;border:1px solid var(--line)}
.hero h1{font:800 2.1rem/1.05 var(--hd);margin:4px 0}
.when{margin-top:12px;font-weight:600}
.cd{font:800 1.5rem var(--hd);color:var(--gold);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:.82rem}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.btn{display:block;width:100%;background:var(--gold);color:#1a1400;border:0;border-radius:10px;padding:12px;font:700 .95rem var(--bd);cursor:pointer;margin-top:14px}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold);margin-top:10px}
.news{list-style:none}
.news li{padding:10px 0;border-bottom:1px solid var(--line)}
.news li:first-child{padding-top:0;font-weight:700}
.news li:last-child{border:0;padding-bottom:0}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.pos{width:26px;font:800 1rem var(--hd);text-align:center}
.bar{width:4px;height:30px;border-radius:2px;flex-shrink:0}
.grow{flex:1;min-width:0}
.pts{font:800 1.1rem var(--hd);text-align:right}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button,.pick button{background:var(--card);border:1px solid var(--line);color:var(--mu);border-radius:10px;padding:8px 14px;font:600 .88rem var(--bd);cursor:pointer}
.seg button.on,.pick button.on{background:var(--gold);color:#1a1400;border-color:var(--gold)}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
input[type=time]{background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:8px;font-size:1rem}
input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.85)}
.msg{margin-top:8px;font-size:.85rem;color:var(--gold);min-height:1.2em}
details summary{cursor:pointer;color:var(--mu);font-size:.85rem;margin-top:8px}
.flag{width:22px;height:15px;border-radius:2px;object-fit:cover}
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl th,.tbl td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--mu);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.fl{background:#b15eff;color:#fff;border-radius:4px}
select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.9rem}
.av{width:34px;height:34px;object-fit:contain;flex-shrink:0}
.trk{width:100%;max-height:200px;object-fit:contain;border-radius:8px;cursor:zoom-in;margin-bottom:10px;display:block}
.note{border-left:3px solid var(--line);background:rgba(255,255,255,.04);border-radius:4px;padding:6px 10px;margin-bottom:8px;font-size:.85rem}
.note.gold{border-color:var(--gold)}.note.purple{border-color:#b15eff}
.strat{padding:7px 0;border-bottom:1px solid var(--line);font-size:.85rem}
.stint{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.75rem;font-weight:700;margin:4px 4px 0 0;background:#3a4a40}
.soft{background:#e8002d}.med{background:#ffd23f;color:#111}.hard{background:#eee;color:#111}.inter{background:#39b54a}.wet{background:#2d7ff9}
.livebtn{background:#e10600;color:#fff;animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(225,6,0,.6)}70%{box-shadow:0 0 0 12px rgba(225,6,0,0)}100%{box-shadow:0 0 0 0 rgba(225,6,0,0)}}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;align-items:center;justify-content:center}
.lb.on{display:flex}.lb img{max-width:94%;max-height:88%;border-radius:8px}
.pod{width:100%;border-radius:14px;margin-bottom:14px;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:rgba(14,26,20,.96);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
nav button{flex:1;max-width:150px;background:none;border:0;color:var(--mu);padding:8px 4px;border-radius:10px;font:700 .8rem var(--bd);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.25rem}
nav button.on{color:var(--gold);background:rgba(255,210,63,.1)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="logo.png" alt="" onerror="this.remove()">Gurkensöhne Cup</div>
  <div class="st" id="st">Verbinde…</div>
</header>
<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-termin"></section>
  <section class="view" id="v-wertung"></section>
  <section class="view" id="v-stats"></section>
  <section class="view" id="v-rennen"></section>
  <section class="view" id="v-live"></section>
</main>
<div class="lb" id="lb" data-a="lbx"><img id="lbi" alt=""></div>
<nav>
  <button data-a="go" data-v="home"><span>🏠</span>Start</button>
  <button data-a="go" data-v="termin"><span>📅</span>Termin</button>
  <button data-a="go" data-v="wertung"><span>🏆</span>Wertung</button>
  <button data-a="go" data-v="stats"><span>📈</span>Stats</button>
  <button data-a="go" data-v="rennen"><span>🏁</span>Rennen</button>
  <button data-a="go" data-v="live"><span>🔴</span>Live</button>
</nav>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const app = initializeApp({
  apiKey: "AIzaSyDDfD7PAl2RoeeSvzp6KnLHw1-ojEeYLaA",
  authDomain: "gurkensohne-cup.firebaseapp.com",
  databaseURL: "https://gurkensohne-cup-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gurkensohne-cup",
  appId: "1:395947948221:web:8b201ab21470678caa9fd4"
});
const db = getDatabase(app);

const TC = {'Ferrari':'#e8002d','McLaren':'#ff8000','Red Bull':'#3671c6','Mercedes-AMG Petronas':'#27f4d2','Aston Martin':'#358c75','Alpine':'#ff87bc','Williams':'#64c4ff','Visa Cash App RB':'#6692ff','Kick Sauber':'#52e252','Haas':'#b6babd'};
const F1 = {1:25,2:18,3:15,4:12,5:10,6:8,7:6,8:4,9:2,10:1};

const MASTER = ('AUS|au|Australien|Melbourne|Australia.avif;CHN|cn|China|Shanghai|China.avif;JPN|jp|Japan|Suzuka|Japan.avif;BHR|bh|Bahrain|Sachir|Bahrain.avif;SAU|sa|Saudi-Arabien|Dschidda|Saudi_Arabia.avif;MIA|us|USA|Miami|Miami.avif;IMO|it|Emilia-Romagna|Imola|Emilia Romagna.avif;MCO|mc|Monaco|Monte Carlo|Monaco.avif;ESP|es|Spanien|Barcelona|Spain.avif;CAN|ca|Kanada|Montreal|Canada.avif;AUT|at|Österreich|Spielberg|Austria.avif;GBR|gb|Großbritannien|Silverstone|Great Britain.avif;BEL|be|Belgien|Spa-Francorchamps|Belgium.avif;HUN|hu|Ungarn|Hungaroring|Hungary.avif;NLD|nl|Niederlande|Zandvoort|Netherlands.avif;ITA|it|Italien|Monza|Italy.avif;AZE|az|Aserbaidschan|Baku|Azerbaijan.avif;SGP|sg|Singapur|Singapur|Singapore.avif;USA|us|USA|Austin|USA.avif;MEX|mx|Mexiko|Mexiko-Stadt|Mexico.avif;BRA|br|Brasilien|São Paulo|Brazil.avif;VGS|us|USA|Las Vegas|Las Vegas.avif;QAT|qa|Katar|Lusail|Qatar.avif;UAE|ae|Ver. Arab. Emirate|Abu Dhabi|Abu Dhabi.avif')
  .split(';').map(s => { const [code, cc, country, city, hero] = s.split('|'); return { code, cc, country, city, hero }; });

const TRK = 'australia-gp,chinese-gp,japanese-gp,bahrain-gp,saudi-arabian-gp,miami-gp,emilia-romagna-gp,monaco-gp,spanish-gp,canadian-gp,austrian-gp,british-gp,belgian-gp,hungarian-gp,dutch-gp,italian-gp,azerbaijan-gp,singapore-gp,united-states-gp,mexican-gp,sao-paulo-gp,las-vegas-gp,qatar-gp,yas-marina-circuit-abu-dhabi-2'.split(',');
MASTER.forEach((m, i) => m.trk = TRK[i] + '.png');
const HELM = { 'McLaren': 'mclaren', 'Mercedes-AMG Petronas': 'mercedes', 'Ferrari': 'ferrari', 'Red Bull': 'redbull', 'Aston Martin': 'astonmartin', 'Williams': 'williams', 'Alpine': 'alpine', 'Haas': 'haas', 'Visa Cash App RB': 'racingbulls', 'Kick Sauber': 'kicksauber' };
const DEF = ('Timotheus Müller|Visa Cash App RB|Timo;Pascale Braasch|Visa Cash App RB|Pascale;Niklas Schweisfurth|Aston Martin|Niklas;Tim Löffler|Kick Sauber|Tim;Marcel Walle|Red Bull|Marcel;Yannis Herling|Alpine|Yannis;Eric Walter|Ferrari|Eric;Philipp Juny|McLaren|Philipp;Charles Leclerc|Ferrari|;Lando Norris|McLaren|;Andrea Kimi Antonelli|Mercedes-AMG Petronas|;Max Verstappen|Red Bull|;George Russell|Mercedes-AMG Petronas|;Alex Albon|Williams|;Carlos Sainz|Williams|;Pierre Gasly|Alpine|;Oliver Bearman|Haas|;Nico Hulkenberg|Kick Sauber|;Esteban Ocon|Haas|;Lance Stroll|Aston Martin|')
  .split(';').map(s => { const [name, team, human] = s.split('|'); return { name, team, human: human || null }; });

let S = { persons: [], date: null, start: null, end: null };
let RR = {}, RS = {}, TR = {}, roster = DEF, cal = null, TA = {}, openRace = null, rdFlag = false;
let view = 'home', me = '', sel = [], tm = {}, wt = 'd', sv = 'elo', msg = '', SA = {}, LT = null, rvA = '', rvB = '';

const toArr = v => v ? (Array.isArray(v) ? v : Object.values(v)) : [];
const nm = d => d.human || d.name;
const av = d => d.photo ? `<img class="av" src="${d.photo}" alt="" onerror="this.remove()">` : '';
const humans = () => roster.filter(d => d.human);
const races = () => {
  const codes = cal && cal.length ? cal : MASTER.map(r => r.code);
  return codes.map((c, i) => ({ ...MASTER.find(r => r.code === c), num: i + 1 })).filter(r => r.code);
};
const isDone = r => !!RS[r.num];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtLong = s => new Date(s + 'T00:00:00').toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = s => new Date(s + 'T00:00:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
const flag = cc => `<img class="flag" src="https://flagcdn.com/w40/${cc}.png" alt="">`;

function standings() {
  const m = {};
  roster.forEach(d => m[d.name] = 0);
  Object.values(RR).forEach(r => Object.entries(r || {}).forEach(([n, e]) => {
    const p = parseInt(e && e.pos);
    if (F1[p] && n in m) m[n] += F1[p];
  }));
  return roster.map(d => ({ ...d, pts: m[d.name] })).sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name));
}
function teamStandings() {
  const t = {};
  standings().forEach(d => t[d.team] = (t[d.team] || 0) + d.pts);
  return Object.entries(t).sort((a, b) => b[1] - a[1]);
}
function winnerOf(r) {
  const hit = Object.entries(RR[r.num] || {}).find(([, e]) => e && String(e.pos).trim() === '1');
  const d = hit && roster.find(x => x.name === hit[0]);
  return d ? nm(d) : null;
}
function enteredNames() { return S.persons.filter(p => p.slots && p.slots.length).map(p => p.name); }

const pp = e => { const p = e && e.pos != null ? String(e.pos).trim() : ''; return /^\d+$/.test(p) ? +p : null; };
const hasPos = e => !!e && e.pos != null && String(e.pos).trim() !== '';
const qg = e => { const q = e && e.qualGap != null ? String(e.qualGap).trim() : ''; if (!q) return { h: 0 }; if (/^(dnf|dsq|dns)$/i.test(q)) return { h: 1, dnf: 1 }; const g = parseFloat(q.replace(',', '.')); return isNaN(g) ? { h: 0 } : { h: 1, g }; };
const chrono = () => {
  const l = [], ks = o => Object.keys(o).map(Number).sort((a, b) => a - b);
  ks(SA).forEach(n => { const r = (SA[n] && SA[n].raceResults) || {}; ks(r).forEach(k => l.push(r[k])); });
  ks(RR).forEach(k => l.push(RR[k]));
  return l;
};
function elo() {
  const H = humans(), E = {}, hist = {};
  H.forEach(d => { E[d.name] = 1000; hist[d.name] = [1000]; });
  chrono().forEach(res => {
    if (!res) return;
    const en = H.map(d => ({ n: d.name, r: res[d.name] })).filter(e => hasPos(e.r));
    if (en.length < 2) return;
    const N = en.length;
    en.forEach(e => { const p = pp(e.r); e.rk = p === null ? 99 : p; e.q = qg(e.r); });
    [...en].sort((a, b) => a.rk - b.rk).forEach((e, i) => e.rs = (N - 1 - i) / (N - 1));
    const mg = Math.max(0, ...en.filter(e => e.q.h && !e.q.dnf).map(e => e.q.g));
    en.forEach(e => { e.qs = e.q.dnf ? 0 : (!e.q.h ? .5 : (mg > 0 ? 1 - e.q.g / mg : 1)); e.c = .7 * e.rs + .3 * e.qs; });
    const dl = {}; en.forEach(e => dl[e.n] = 0);
    en.forEach(a => en.forEach(b => {
      if (a === b) return;
      const ex = 1 / (1 + 10 ** ((E[b.n] - E[a.n]) / 400)), sc = a.c > b.c ? 1 : a.c < b.c ? 0 : .5;
      dl[a.n] += 28 * (sc - ex) / (N - 1);
    }));
    en.forEach(e => { E[e.n] += dl[e.n]; hist[e.n].push(E[e.n]); });
  });
  return { E, hist };
}
function careerStats() {
  const o = {}; humans().forEach(d => o[d.name] = { s: 0, f: 0, w: 0, p: 0, b: 99, ps: 0 });
  chrono().forEach(res => { if (!res) return; humans().forEach(d => {
    const e = res[d.name]; if (!hasPos(e)) return;
    const x = o[d.name], p = pp(e); x.s++;
    if (p !== null) { x.f++; x.ps += p; if (p < x.b) x.b = p; if (p === 1) x.w++; if (p <= 3) x.p++; }
  }); });
  return o;
}
function h2h(a, b) {
  const o = { n: 0, ra: 0, rb: 0, qa: 0, qb: 0 };
  chrono().forEach(res => {
    const x = res && res[a], y = res && res[b]; if (!x || !y) return; o.n++;
    if (hasPos(x) && hasPos(y)) {
      const pa = pp(x), pb = pp(y);
      if (pa !== null && pb !== null) { if (pa < pb) o.ra++; else if (pb < pa) o.rb++; }
      else if (pa !== null) o.ra++; else if (pb !== null) o.rb++;
    }
    const qa = qg(x), qb = qg(y);
    if (qa.h && qb.h && !(qa.dnf && qb.dnf)) {
      if (qa.dnf) o.qb++; else if (qb.dnf) o.qa++; else if (qa.g < qb.g) o.qa++; else if (qb.g < qa.g) o.qb++;
    }
  });
  return o;
}
function byIng(n) {
  const c = String(n || '').replace(/^\[KI\]\s*/, '').trim().toLowerCase();
  return roster.find(d => d.racenet && d.racenet.toLowerCase() === c)
    || roster.find(d => !d.human && d.name.toLowerCase() === c)
    || roster.find(d => !d.human && d.name.toLowerCase().split(' ').pop() === c) || null;
}
function crossHtml() {
  const rs = races();
  return `<table class="tbl"><thead><tr><th>Fahrer</th>${rs.map(r => `<th>${r.code}</th>`).join('')}<th>Pkt</th></tr></thead><tbody>${standings().map(d =>
    `<tr><td>${nm(d)}</td>${rs.map(r => { const e = (RR[r.num] || {})[d.name], p = hasPos(e) ? String(e.pos).trim() : '';
      return `<td class="${e && e.fastestLap ? 'fl' : ''}">${p ? (/^\d+$/.test(p) ? p + '.' : p) : '-'}</td>`; }).join('')}<td><b>${d.pts}</b></td></tr>`).join('')}</tbody></table>`;
}
let acBusy = false;
async function autoConfirm() {
  const h = humans(); if (S.date || acBusy || h.length < 2) return;
  const today = iso(new Date()), m = {};
  S.persons.forEach(p => (p.slots || []).forEach(x => { if (x.date >= today) (m[x.date] = m[x.date] || {})[p.name] = x; }));
  const mins = t => { const [a, b] = t.split(':').map(Number); return a * 60 + b; };
  const hhmm = n => `${String(Math.floor(n / 60)).padStart(2, '0')}:${String(n % 60).padStart(2, '0')}`;
  for (const d of Object.keys(m).sort()) {
    const sl = h.map(x => m[d][x.human]); if (sl.some(x => !x)) continue;
    const a = Math.max(...sl.map(x => mins(x.from))), b = Math.min(...sl.map(x => mins(x.to)));
    if (b - a >= 90) {
      acBusy = true;
      try { await set(ref(db, 'renntermin/confirmedDate'), d); await set(ref(db, 'renntermin/confirmedStart'), hhmm(a)); await set(ref(db, 'renntermin/confirmedEnd'), hhmm(b)); }
      catch (e) { console.error(e); }
      acBusy = false; return;
    }
  }
}

async function syncRecords() {
  for (const k of Object.keys(TA)) {
    const fl = TA[k] && TA[k].fastestLap; if (!fl || !fl.lap_time_s) continue;
    const r = races().find(x => x.num === +k); if (!r) continue;
    const ex = TR[r.code];
    if (!ex || fl.lap_time_s < ex.time) {
      const i = byIng(fl.driver), rec = { time: fl.lap_time_s, driver: i && i.human ? i.human : fl.driver, raceNum: r.num, updatedAt: Date.now() };
      TR = { ...TR, [r.code]: rec };
      try { await set(ref(db, 'trackRecords/' + r.code), rec); } catch (e) { console.error(e); }
    }
  }
}
const fmtLap = s => s == null ? '-.---' : `${Math.floor(s / 60)}:${(s % 60).toFixed(3).padStart(6, '0')}`;
const spark = h => {
  if (h.length < 2) return '';
  const mn = Math.min(...h), mx = Math.max(...h), r = Math.max(mx - mn, 1), st = 60 / (h.length - 1);
  const pts = h.map((v, i) => `${(2 + i * st).toFixed(1)},${(20 - (v - mn) / r * 18).toFixed(1)}`).join(' ');
  return `<svg width="64" height="22" viewBox="0 0 64 22"><polyline points="${pts}" fill="none" stroke="${h[h.length - 1] >= h[0] ? '#5ee08a' : '#ff7b6b'}" stroke-width="2" stroke-linejoin="round"/></svg>`;
};
function archiveHtml(r, done) {
  const a = TA[r.num], rec = TR[r.code]; let h = '';
  if (rec) { const cur = a && a.fastestLap && Math.abs(a.fastestLap.lap_time_s - rec.time) < .0005; h += `<div class="note gold">🏆 Streckenrekord: <b>${rec.driver}</b> (${fmtLap(rec.time)})${cur ? ' 🎉 hier aufgestellt!' : ` <span class="sub">(Rennen ${rec.raceNum})</span>`}</div>`; }
  if (!done) return h;
  if (!a) return h + '<div class="sub">Noch kein Telemetrie-Archiv für dieses Rennen.</div>';
  if (a.fastestLap) { const i = byIng(a.fastestLap.driver); h += `<div class="note purple">⚡ Schnellste Runde: <b>${i ? nm(i) : a.fastestLap.driver}</b> (${fmtLap(a.fastestLap.lap_time_s)})</div>`; }
  return h + Object.keys(a.strategies || {}).map(n => {
    const i = byIng(n), st = a.strategies[n] || [];
    return `<div class="strat"><b>${i ? nm(i) : n}</b> <span class="sub">${(a.pitStops || {})[n] ?? 0} Boxenstopp(s)</span><div>${st.map(x => `<span class="stint ${String(x.compound).toLowerCase().replace(/ /g, '')}">${x.compound} ${x.start_lap}-${x.end_lap}</span>`).join('') || '<span class="sub">-</span>'}</div></div>`;
  }).join('');
}

function newsList() {
  const n = [], s = standings(), rs = races();
  const last = rs.filter(isDone).pop();
  if (last) { const w = winnerOf(last); if (w) n.push(`🏁 ${w} gewinnt den GP von ${last.country}.`); }
  if (s[0] && s[0].pts > 0) {
    const gap = s[1] ? s[0].pts - s[1].pts : s[0].pts;
    n.push(s[1] && gap <= 5
      ? `🔥 Enges Titelrennen: ${nm(s[0])} führt nur ${gap} Punkte vor ${nm(s[1])}.`
      : `🏆 ${nm(s[0])} führt die Fahrerwertung mit ${s[0].pts} Punkten an.`);
  }
  const t = teamStandings();
  if (t[0] && t[0][1] > 0) n.push(`🏗️ Konstrukteurs-WM: ${t[0][0]} liegt vorn mit ${t[0][1]} Punkten.`);
  if (chrono().length && humans().length > 1) { const { E } = elo(), top = [...humans()].sort((a, b) => E[b.name] - E[a.name])[0]; n.push(`⚡ Elo-Spitzenreiter: ${top.human} mit ${Math.round(E[top.name])}.`); }
  const rec = Object.entries(TR).sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0))[0];
  if (rec) { const m = MASTER.find(r => r.code === rec[0]); if (m) n.push(`⏱️ Streckenrekord in ${m.country}: ${rec[1].driver}.`); }
  const missing = humans().filter(d => !enteredNames().includes(d.human));
  if (missing.length && !S.date) n.push(`⏳ Es fehlen noch Termine von: ${missing.map(nm).join(', ')}.`);
  if (!n.length) n.push('Noch keine News. Sobald das erste Rennen gefahren ist, geht es hier los.');
  return n.slice(0, 5);
}

function renderHome() {
  const rs = races(), nx = rs.find(r => !isDone(r)), h = humans(), got = enteredNames();
  const missing = h.filter(d => !got.includes(d.human));
  const goLive = rdFlag || (LT && LT.sessionActive) || (S.date && Date.now() >= new Date(`${S.date}T${S.start || '14:00'}:00`).getTime());
  const wa = missing.length ? `<a class="btn ghost" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(`Hallo Jungs! 🏎️ Bitte tragt noch eure Verfügbarkeit für den Gurkensöhne Cup ein:\nEs fehlen noch: ${missing.map(nm).join(', ')}`)}">📲 Per WhatsApp erinnern</a>` : '';
  let hero;
  if (nx) {
    hero = `<div class="hero" style="background-image:linear-gradient(135deg,rgba(14,26,20,.78),rgba(14,26,20,.92)),url('${nx.hero}')">
      <div class="sub">Nächstes Rennen, Nr. ${nx.num} von ${rs.length}</div>
      <h1>GP ${nx.country}</h1><div class="sub">${nx.city}</div>
      ${S.date ? `<div class="when">${fmtLong(S.date)}, ${S.start || '14:00'} bis ${S.end || '18:00'} Uhr</div><div class="cd" id="cd"></div>`
               : `<div class="when">Termin noch offen</div>`}
      ${S.date ? '' : `<div class="chips">${h.map(d => `<span class="chip ${got.includes(d.human) ? 'ok' : ''}">${got.includes(d.human) ? '✓' : '⏳'} ${d.human}</span>`).join('')}</div>`}
      ${!S.date && missing.length ? `<button class="btn" data-a="go" data-v="termin">Verfügbarkeit eintragen</button>` : ''}
      ${wa}${goLive ? `<button class="btn livebtn" data-a="go" data-v="live">🔴 ${LT && LT.sessionActive ? 'LIVE, jetzt ansehen' : 'Go Live'}</button>` : ''}
    </div>`;
  } else {
    hero = `<div class="hero" style="background:var(--card)"><h1>Saison beendet</h1><div class="sub">Alle Rennen sind gefahren.</div></div>`;
  }
  const ld = rs.filter(isDone).pop();
  const pod = ld ? `<img class="pod" src="podium-${ld.code.toLowerCase()}.gif" alt="Podium ${ld.country}" data-c="${ld.code.toLowerCase()}" onerror="const e=['jpg','jpeg','png','webp'],i=+(this.dataset.i||0);if(i<e.length){this.dataset.i=i+1;this.src='podium-'+this.dataset.c+'.'+e[i]}else this.remove()">` : '';
  const top = standings().slice(0, 5);
  document.getElementById('v-home').innerHTML = hero + pod + `
    <div class="card"><h2>Neueste News</h2><ul class="news">${newsList().map(x => `<li>${x}</li>`).join('')}</ul></div>
    <div class="card"><h2>Fahrerwertung, Top 5</h2>
      ${top.map((d, i) => `<div class="row"><div class="pos">${i + 1}</div><div class="bar" style="background:${TC[d.team] || '#888'}"></div>${av(d)}
        <div class="grow"><b>${nm(d)}</b><div class="sub">${d.team}</div></div><div class="pts">${d.pts}</div></div>`).join('')}
      <button class="btn ghost" data-a="go" data-v="wertung">Ganze Wertung ansehen</button></div>`;
}

function renderTermin() {
  const h = humans(), today = iso(new Date());
  const days = Array.from({ length: 21 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return iso(d); });
  const map = {};
  S.persons.forEach(p => (p.slots || []).forEach(s => { if (s.date >= today) (map[s.date] = map[s.date] || []).push(p.name); }));
  const ranked = Object.entries(map).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
  const dayRow = ([d, names]) => `<div class="row"><div class="grow"><b>${fmtShort(d)}</b>
    <div class="sub">${names.join(', ')}</div></div><div class="pts" style="color:${names.length === h.length ? 'var(--ok)' : 'var(--tx)'}">${names.length}/${h.length}</div></div>`;
  document.getElementById('v-termin').innerHTML = `
    ${S.date ? `<div class="card" style="border-color:var(--ok)"><h2>Termin steht</h2><div>${fmtLong(S.date)}, ${S.start || '14:00'} bis ${S.end || '18:00'} Uhr</div></div>` : ''}
    <div class="card"><h2>Verfügbarkeit eintragen</h2>
      <div class="sub" style="margin-bottom:8px">1. Wer bist du?</div>
      <div class="pick">${h.map(d => `<button class="${me === d.human ? 'on' : ''}" data-a="user" data-v="${d.human}">${enteredNames().includes(d.human) ? '✓ ' : ''}${d.human}</button>`).join('')}</div>
      <div class="sub" style="margin-bottom:8px">2. An welchen Tagen kannst du?</div>
      <div class="pick">${days.map(d => `<button class="${sel.includes(d) ? 'on' : ''}" data-a="day" data-v="${d}">${fmtShort(d)}</button>`).join('')}</div>
      <div class="sub" style="margin-bottom:8px">3. Uhrzeit pro Tag</div>
      ${sel.length ? sel.map(d => `<div class="row"><div class="grow"><b>${fmtShort(d)}</b></div><input type="time" class="tmi" data-d="${d}" data-k="from" value="${tm[d].from}"> bis <input type="time" class="tmi" data-d="${d}" data-k="to" value="${tm[d].to}"></div>`).join('') : '<div class="sub">Wähle zuerst Tage aus.</div>'}
      <button class="btn" data-a="save">Speichern</button><div class="msg">${msg}</div>
    </div>
    <div class="card"><h2>Beste Tage</h2>
      ${ranked.length ? ranked.slice(0, 3).map(dayRow).join('') : '<div class="sub">Noch keine Einträge.</div>'}
      ${ranked.length > 3 ? `<details><summary>Alle ${ranked.length} Tage anzeigen</summary>${ranked.slice(3).map(dayRow).join('')}</details>` : ''}
    </div>`;
}

function renderWertung() {
  const list = wt === 'd'
    ? standings().map(d => ({ n: nm(d), s: d.team, c: TC[d.team], p: d.pts, ph: d.photo }))
    : teamStandings().map(([t, p]) => ({ n: t, s: '', c: TC[t], p, ph: HELM[t] ? `helmet_${HELM[t]}.png` : '' }));
  document.getElementById('v-wertung').innerHTML = `
    <div class="seg"><button class="${wt === 'd' ? 'on' : ''}" data-a="wt" data-v="d">Fahrer</button><button class="${wt === 'x' ? 'on' : ''}" data-a="wt" data-v="x">Ergebnisse</button><button class="${wt === 't' ? 'on' : ''}" data-a="wt" data-v="t">Teams</button></div>
    <div class="card" ${wt === 'x' ? 'style="overflow-x:auto"' : ''}>${wt === 'x' ? crossHtml() : list.map((x, i) => `<div class="row"><div class="pos">${i + 1}</div><div class="bar" style="background:${x.c || '#888'}"></div>${x.ph ? `<img class="av" src="${x.ph}" alt="" onerror="this.remove()">` : ''}
      <div class="grow"><b>${x.n}</b>${x.s ? `<div class="sub">${x.s}</div>` : ''}</div><div class="pts">${x.p}</div></div>`).join('')}</div>`;
}

function renderRennen() {
  const rs = races(), nx = rs.find(r => !isDone(r));
  document.getElementById('v-rennen').innerHTML = `<div class="card"><h2>Rennkalender</h2>${rs.map(r => {
    const done = isDone(r), w = done ? winnerOf(r) : null, open = openRace === r.num;
    return `<div style="border-bottom:1px solid var(--line)"><div class="row" style="border:0;cursor:pointer;${done ? 'opacity:.85' : ''}" data-a="rc" data-v="${r.num}"><div class="pos sub">${r.num}</div>${flag(r.cc)}
      <div class="grow"><b style="${nx && nx.num === r.num ? 'color:var(--gold)' : ''}">${r.country}</b><div class="sub">${r.city}</div></div>
      <div class="sub">${done ? '🏁 ' + (w || 'gefahren') : (nx && nx.num === r.num ? '⚡ als Nächstes' : '')} ${open ? '▲' : '▼'}</div></div>
      ${open ? `<div style="padding:4px 0 14px"><img class="trk" src="${r.trk}" data-a="lb" data-v="${r.trk}" alt="Strecke ${r.country}" onerror="this.remove()">${archiveHtml(r, done)}</div>` : ''}</div>`;
  }).join('')}</div>`;
}

function renderStats() {
  const H = humans(), { E, hist } = elo(); let b = '';
  if (sv === 'elo') {
    b = `<div class="card">${[...H].sort((x, y) => E[y.name] - E[x.name]).map((d, i) => {
      const h = hist[d.name], dl = h.length > 1 ? h[h.length - 1] - h[h.length - 2] : 0;
      return `<div class="row"><div class="pos">${i + 1}</div><div class="bar" style="background:${TC[d.team] || '#888'}"></div>${av(d)}
        <div class="grow"><b>${d.human}</b><div class="sub">${d.team}, ${h.length - 1} Rennen gewertet</div></div>
        ${spark(h)}<div class="sub" style="color:${dl > 1 ? 'var(--ok)' : dl < -1 ? 'var(--bad)' : 'var(--mu)'}">${Math.abs(dl) > 1 ? (dl > 0 ? '▲ ' : '▼ ') + Math.round(Math.abs(dl)) : '–'}</div>
        <div class="pts" style="width:56px">${Math.round(E[d.name])}</div></div>`; }).join('')}</div>`;
  } else if (sv === 'car') {
    const cs = careerStats();
    b = `<div class="card" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Fahrer</th><th>Starts</th><th>Siege</th><th>Podien</th><th>Bester</th><th>Ø Platz</th><th>Ausfälle</th><th>Zuverl.</th></tr></thead><tbody>${[...H].sort((x, y) => cs[y.name].w - cs[x.name].w || cs[y.name].p - cs[x.name].p).map(d => {
      const s = cs[d.name];
      return `<tr><td>${d.human}</td><td>${s.s}</td><td><b>${s.w}</b></td><td>${s.p}</td><td>${s.b < 99 ? s.b : '-'}</td><td>${s.f ? (s.ps / s.f).toFixed(1) : '-'}</td><td>${s.s - s.f}</td><td>${s.s ? Math.round(s.f / s.s * 100) + '%' : '-'}</td></tr>`; }).join('')}</tbody></table></div>`;
  } else {
    const a = rvA || H[0].name, c = rvB && rvB !== a ? rvB : (H.find(d => d.name !== a) || H[0]).name;
    const o = h2h(a, c), opt = v => H.map(d => `<option value="${d.name}" ${d.name === v ? 'selected' : ''}>${d.human}</option>`).join('');
    const rw = (l, x, y) => `<div class="row"><div class="pts" style="width:60px">${x}</div><div class="grow sub" style="text-align:center">${l}</div><div class="pts" style="width:60px;text-align:right">${y}</div></div>`;
    b = `<div class="card"><div class="pick"><select id="rvA">${opt(a)}</select><select id="rvB">${opt(c)}</select></div>${o.n
      ? rw('Rennen vorn', o.ra, o.rb) + rw('Quali vorn', o.qa, o.qb) + rw('Elo', Math.round(E[a]), Math.round(E[c])) + `<div class="sub" style="margin-top:8px">Aus ${o.n} gemeinsamen Rennen, alle Saisons.</div>`
      : '<div class="sub">Noch kein gemeinsames Rennen.</div>'}</div>`;
  }
  document.getElementById('v-stats').innerHTML = `<div class="seg">${[['elo', 'Elo'], ['car', 'Karriere'], ['duel', 'Duell']].map(([k, l]) => `<button class="${sv === k ? 'on' : ''}" data-a="sv" data-v="${k}">${l}</button>`).join('')}</div>` + b;
}

function renderLive() {
  const el = document.getElementById('v-live');
  if (!LT || !LT.drivers) { el.innerHTML = '<div class="card"><h2>Live-Timing</h2><div class="sub">Gerade läuft keine Session. Sobald jemand das Telemetrie-Skript startet, erscheint hier alles automatisch.</div></div>'; return; }
  const ds = Object.values(LT.drivers).filter(d => d.pos > 0).sort((a, b) => a.pos - b.pos);
  const tk = [...(LT.ticker || [])].reverse();
  el.innerHTML = `<div class="card" style="overflow-x:auto"><h2>${LT.sessionActive ? '🔴 Live-Timing' : 'Letzte Session'}</h2>
    <table class="tbl"><thead><tr><th>Fahrer</th><th>Rd</th><th>Abstand</th><th>Reifen</th><th>Box</th></tr></thead><tbody>${ds.map(d => {
      const i = byIng(d.name), tag = d.stale ? ' (weg)' : (d.resultStatus === 4 || d.resultStatus === 6) ? ' (OUT)' : d.resultStatus === 5 ? ' (DSQ)' : '';
      return `<tr><td style="border-left:4px solid ${(i && TC[i.team]) || '#888'}">P${d.pos} <b>${i ? nm(i) : d.name}</b>${tag}</td><td>${d.lap ?? '-'}</td><td>${d.gapMs > 0 ? '+' + (d.gapMs / 1000).toFixed(3) : '-'}</td><td>${d.tyre || '?'}</td><td>${d.pitStops ?? 0}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="card"><h2>Ticker</h2>${tk.length ? `<ul class="news">${tk.map(x => `<li>${x}</li>`).join('')}</ul>` : '<div class="sub">Keine Events bisher.</div>'}</div>`;
}

function render() {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + view));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  renderHome(); renderTermin(); renderWertung(); renderStats(); renderRennen(); renderLive();
}

async function save() {
  if (!me) { msg = 'Bitte zuerst deinen Namen wählen.'; return render(); }
  if (!sel.length) { msg = 'Bitte mindestens einen Tag wählen.'; return render(); }
  const persons = S.persons.filter(p => p.name !== me).concat({ name: me, slots: sel.map(date => ({ date, from: tm[date].from, to: tm[date].to })) });
  try { await set(ref(db, 'renntermin/persons'), persons); msg = 'Gespeichert ✓'; }
  catch (e) { console.error(e); msg = 'Speichern fehlgeschlagen. Bitte später erneut versuchen.'; }
  render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if (a === 'go') { view = v; msg = ''; scrollTo(0, 0); }
  else if (a === 'user') {
    me = v; msg = '';
    const p = S.persons.find(x => x.name === v);
    sel = p ? p.slots.map(s => s.date) : [];
    tm = {}; sel.forEach((d, i) => tm[d] = { from: p.slots[i].from, to: p.slots[i].to });
  }
  else if (a === 'day') { if (sel.includes(v)) sel = sel.filter(x => x !== v); else { sel = [...sel, v].sort(); tm[v] = tm[v] || { from: '14:00', to: '18:00' }; } }
  else if (a === 'wt') wt = v;
  else if (a === 'sv') sv = v;
  else if (a === 'rc') openRace = openRace === +v ? null : +v;
  else if (a === 'lb') { document.getElementById('lbi').src = v; document.getElementById('lb').classList.add('on'); return; }
  else if (a === 'lbx') { document.getElementById('lb').classList.remove('on'); return; }
  else if (a === 'save') return save();
  render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList.contains('tmi') && tm[t.dataset.d]) tm[t.dataset.d][t.dataset.k] = t.value;
  if (t.id === 'rvA') { rvA = t.value; render(); }
  if (t.id === 'rvB') { rvB = t.value; render(); }
});

setInterval(() => {
  const el = document.getElementById('cd');
  if (!el || !S.date) return;
  const diff = new Date(`${S.date}T${S.start || '14:00'}:00`) - Date.now();
  if (diff <= 0) { el.textContent = '🏎️ Race Day!'; if (!rdFlag) { rdFlag = true; render(); } return; }
  const d = Math.floor(diff / 864e5), h = Math.floor(diff % 864e5 / 36e5), m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3);
  el.textContent = `${d}T ${h}Std ${m}Min ${s}Sek`;
}, 1000);

const on = (p, f) => onValue(ref(db, p), snap => { f(snap.val()); render(); }, err => console.error(p, err));
on('renntermin', v => {
  S = { persons: toArr(v && v.persons), date: v && v.confirmedDate, start: v && v.confirmedStart, end: v && v.confirmedEnd };
  const st = document.getElementById('st'); st.textContent = 'Live'; st.classList.add('live');
  autoConfirm();
});
on('raceResults', v => RR = v || {});
on('seasons', v => SA = v || {});
on('liveTiming', v => LT = v);
on('raceStatus', v => RS = v || {});
on('trackRecords', v => TR = v || {});
on('telemetryArchive', v => { TA = v || {}; syncRecords(); });
on('driverRoster', v => { const l = toArr(v); roster = l.length ? l : DEF; });
on('raceCalendarCodes', v => { const l = toArr(v); cal = l.length ? l : null; });
render();
</script>
</body>
</html>
